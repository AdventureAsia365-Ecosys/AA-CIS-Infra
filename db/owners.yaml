# Owner registry of the shared RDS aa-cis-dev-db (acc2 005097885195, us-west-1).
#
# Data standards DM-1.2 / DM-1.3 / DM-8.1 / DM-8.2, ADR 0008 playbook step 2, ADR 0003a decision 3,
# X1 plan S1 (AA-Ecosys docs/audits/2026-10-17-S241-x1/x1-plan.md). One entry per migration dir of
# db/migrations/. Change it in the same PR as the code that mirrors it:
#   * db/run_migration.py      MASTER_ROLE, OWNER_DIRS (anchor schema, schemas, set_local_roles,
#                              role_lint_from, view_owner_roles), IDLE_EXEMPT_KINDS
#   * db/check_migration_copies.py  OWNERS (repo, path, key prefix, native), PATH_RE
#   * db/run_migration.py      PASSWORD_ROLES (password_roles, X1 S12)
#   * .github/workflows/db-migrate.yml  input regex, key prefix case, environment choices, set-password role regex
#   * db/isolation_probe.py    MASTER_ROLE, OWNERS (schemas, anchor_schema, owner_role, owner_transfer_key,
#                              runtime_secrets, view_owner_roles, runtime_privileges[_from]),
#                              CONSUMER_GRANTS, RLS_ENABLE_ONLY_ALLOWLIST (X1 S2)
# db/tests/test_owners_registry.py fails when any of them disagrees with this file. The runner and
# the guards keep their own constants on purpose: they run with the standard library only (the
# ECS task gets just the runner and the SQL through presigned URLs).
#
# Roles: `owner_role` is the NOLOGIN target owner of the schemas (X1). Until the transfer of that
# owner (bk-014, tp-013, CIS 245) the objects are still owned by `owner_role_today`. DB Migrate never
# reads either field to pick a role: it reads the LIVE owner of `anchor_schema` before every file
# (XD8) and runs the file as that role, so the switch follows the transfer with no registry change.
# Runtime role names are kept as they are (XD1): `booking`, `tripplanner`, `aa_app_user`.

version: 1

# DB Migrate `environment` input (DM-8.2). Only dev exists; a prod entry comes with the prod blueprint.
environments: [dev]

# RDS master. Runs roles/ files and DB Migrate mode=set-password / run-script; break-glass only after X1 S22
# (DM-8.9). Owns the public extensions (vector, pg_stat_statements) and the public.* leftovers.
master_role: aa_cis_admin

# DB Migrate login from X1 S22 (rl-002, X1 S20, creates it, NOCREATEROLE). PostgreSQL checks
# SET ROLE against the SESSION user's memberships, so it must be a member of every role a file can be
# switched to: each owner_role (the runner's live-owner switch, XD8) and every set_local_roles entry
# (catalog_owner for the S22 catalog recipe, cis_owner the way back, cis_app for the 244-style guard
# blocks), plus pg_read_all_stats (schema dump / probe session cells). Never aa_app_user (§1.4 of the
# X1 plan: a policy TO r reaches its members). db/tests/test_roles_files.py checks this list against
# the owners above and, once a roles/ file creates the role, against that file's grants; DB Migrate
# refuses (exit 8, also in check mode) a file whose SET LOCAL ROLE target the login cannot reach.
migrator_role: db_migrator
migrator_member_of: [bk_owner, catalog_owner, cis_app, cis_owner, pg_read_all_stats, tp_owner]

# DB Migrate mode=set-password (X1 S12, plan XD2): the LOGIN roles whose password the workflow sets, and the
# DSN secret each one's password is read from inside the task (Nghiệp writes the DSN in the Console, S17 /
# S20). Mirrored by db/run_migration.py PASSWORD_ROLES and the role regex of db-migrate.yml "Validate input".
# The legacy runtime roles (booking, tripplanner, aa_app_user) keep the passwords they have (XD1).
password_roles: {cis_app: aa-cis/dev/rds-cis-app, db_migrator: aa-cis/dev/db-migrator}

owners:
  cis:
    repo: AA-CIS-App
    path: api/migrations
    key_prefix: ""                       # plain NNN (kept for history)
    anchor_schema: shared
    schemas: [acp_contract, acp_deliver, acp_gold_output, acp_shared, acp_silver_s2, acp_silver_s3,
              acp_silver_s4, catalog, geo, gold_aa_internal, shared, silver_aa_internal]
    owner_role: cis_owner                # X1 S20 (rl-002) + S21 (245)
    owner_role_today: aa_cis_admin
    owner_transfer_key: "245"            # schema_versions key that moves the objects to owner_role (probe state key)
    runtime_roles: [cis_app, aa_app_user]          # cis_app from X1 S18 (api + worker), aa_app_user = tenant pool
    runtime_roles_today: [aa_cis_admin, aa_app_user]
    # DSN secret of each runtime role: the isolation probe logs in with these (X1 S2), never as the master.
    runtime_secrets: {cis_app: aa-cis/dev/rds-cis-app, aa_app_user: aa-cis/dev/rds-app-user}
    # What each runtime role must hold in its schemas (isolation probe cells runtime_grants.<owner> and
    # default_acl.<owner>, X1 review S241): `objects` on every existing object (plus USAGE on each schema;
    # sequences other than identity sequences, functions other than trigger functions), `default_acl`
    # from pg_default_acl FOR ROLE <live owner of anchor_schema> IN SCHEMA s, so objects the owner creates
    # later reach the runtime too. Expected once the transfer is in force (owner_transfer_key registered
    # AND anchor_schema owned by owner_role), or from runtime_privileges_from when set.
    # aa_app_user has no schema-wide rights (per table + RLS, CIS 241), so only cis_app is listed.
    runtime_privileges:
      cis_app:
        schemas: [acp_contract, acp_deliver, acp_gold_output, acp_shared, acp_silver_s2, acp_silver_s3,
                  acp_silver_s4, geo, gold_aa_internal, shared, silver_aa_internal]   # catalog: no grant (244)
        objects: {relation: [SELECT], sequence: [USAGE], function: [EXECUTE]}
        default_acl: {tables: [DELETE, INSERT, SELECT, UPDATE], sequences: [SELECT, UPDATE, USAGE],
                      functions: [EXECUTE]}
    runtime_privileges_from: "244"       # CIS 244 (X1 S16) grants cis_app before the 245 transfer
    # catalog.* views are owned by catalog_owner (NOLOGIN, CIS 225); the schema itself goes to cis_owner.
    # The ownership post-check accepts new objects owned by these roles besides the dir's live owner.
    view_owner_roles: [catalog_owner]
    job_table: shared.job
    job_kind_prefix: ""                  # CIS keeps unprefixed kind names (ADR 0003a decision 3)
    idle_exempt_kinds: []                # none since AA-751 (S240)
    # SET LOCAL ROLE targets the role lint allows in cis/ (X1 plan S1 item 6): catalog_owner (catalog
    # view recipe), cis_owner (the way back from catalog_owner, never RESET ROLE), cis_app (behavioural
    # guard blocks, 244/245). Each must be reachable from the DB Migrate login (migrator_member_of).
    # catalog_owner is reachable only from S22 (db_migrator): catalog.* view changes are frozen from
    # S1 until S22 (X1 review S241; the lint asks for the recipe, the runner refuses it at check time).
    set_local_roles: [catalog_owner, cis_owner, cis_app]
    role_lint_from: 243                  # applied files <= 242 never re-run; 225/235 use the old catalog dance
    # ENABLE-without-FORCE RLS tables that need no permissive policy TO cis_app (probe cell
    # rls.enable_only_has_cis_app_policy, CIS standing CI check, X1 S15/S16). Empty: 244 covers all 8.
    rls_enable_only_allowlist: []
    # Tables where cis_app must read every row, as the platform runtime does today (X1 S16, S243 correction of
    # plan §1.4): the master reads the 8 FORCE RLS tables unfiltered (rds_superuser, AA-817 probe v2) and most
    # CIS code sets no tenant GUC, so CIS 244 gives cis_app a permissive USING (true) WITH CHECK (true) policy
    # on every RLS table, FORCE ones included (<table>_cis_app_all). Probe cell rls.force_parity.cis_app:
    # cis_app's count(*) through its own DSN, without a GUC and under a forged one, equals the catalog login's.
    # Mirrored by db/isolation_probe.py RLS_PARITY_TABLES.
    rls_parity_tables: [gold_aa_internal.content_exports, gold_aa_internal.published_tours,
                        gold_aa_internal.tenant_tour_versions, gold_aa_internal.webhook_deliveries,
                        shared.pipeline_runs, silver_aa_internal.generated_content,
                        silver_aa_internal.quality_scores, silver_aa_internal.raw_tours,
                        silver_aa_internal.seo_context]
    # Grants to other apps' roles (input for the X2 grant guard; not enforced yet). contract = the
    # intended reads (schema-ownership.md rule 2); grandfathered = removed by X4 (TripPlanner decoupling).
    consumer_grants:
      - {grantee: booking,     privilege: "USAGE, SELECT", object: "catalog.* (schema + views)",         status: contract,      source: "225, 228"}
      - {grantee: tripplanner, privilege: "USAGE, SELECT", object: "catalog.* (schema + views)",         status: contract,      source: "225, 228"}
      - {grantee: booking,     privilege: EXECUTE,         object: "geo.name_norm(text)",                status: contract,      source: "228"}
      - {grantee: tripplanner, privilege: EXECUTE,         object: "geo.name_norm(text)",                status: contract,      source: "228"}
      - {grantee: tripplanner, privilege: INSERT,          object: shared.llm_call_log,                  status: contract,      source: "173 (standing write exception)"}
      - {grantee: tripplanner, privilege: SELECT,          object: "shared.llm_role_config, shared.llm_model_catalog", status: grandfathered, source: "173"}
      - {grantee: tripplanner, privilege: SELECT,          object: "silver_aa_internal.raw_tours (tour_id, country)",  status: grandfathered, source: "179"}
      - {grantee: tripplanner, privilege: SELECT,          object: "acp_contract.tour_atoms, acp_contract.v_active_tour_atoms (columns)", status: grandfathered, source: "180, 216"}
      - {grantee: tripplanner, privilege: SELECT,          object: "shared.destinations, shared.v_destination_photos, shared.v_tour_photos", status: grandfathered, source: "201"}
      - {grantee: tripplanner, privilege: SELECT,          object: gold_aa_internal.published_tours,     status: grandfathered, source: "tenant RLS read"}
    # Grants to other owners' NOLOGIN owner roles (input for the X2 grant guard and the S2 probe's owner-role
    # cell; not enforced yet). CIS 243 (X1 S4): what DB Migrate needs to register a Booking / TripPlanner file
    # as its owner role (MIG-2) and what booking.v_schema_versions reads with its owner's rights. No grant
    # option, no other privilege. The BEFORE INSERT key guard on the registry lets bk_owner insert only bk-
    # keys and tp_owner only tp- keys; members of the registry owner insert any key, every other role none.
    owner_grants:
      - {grantee: bk_owner, privilege: USAGE,          object: "shared (schema)",      status: contract, source: "243 (MIG-2 self-registration)"}
      - {grantee: bk_owner, privilege: "SELECT, INSERT", object: shared.schema_versions, status: contract, source: "243 (MIG-2 self-registration; bk- keys only, key guard)"}
      - {grantee: tp_owner, privilege: USAGE,          object: "shared (schema)",      status: contract, source: "243 (MIG-2 self-registration)"}
      - {grantee: tp_owner, privilege: "SELECT, INSERT", object: shared.schema_versions, status: contract, source: "243 (MIG-2 self-registration; tp- keys only, key guard)"}

  booking:
    repo: AA-Booking
    path: migrations
    key_prefix: bk-
    anchor_schema: booking
    schemas: [booking]
    owner_role: bk_owner                 # X1 S3 (rl-001) + S6 (bk-014)
    owner_role_today: aa_cis_admin
    owner_transfer_key: bk-014
    runtime_roles: [booking]             # API + in-process booking.job worker
    runtime_roles_today: [booking]
    runtime_secrets: {booking: booking/dev/database-url}
    # What each runtime role must hold in its schemas (isolation probe cells runtime_grants.<owner> and
    # default_acl.<owner>, X1 review S241): `objects` on every existing object (plus USAGE on each schema;
    # sequences other than identity sequences, functions other than trigger functions), `default_acl`
    # from pg_default_acl FOR ROLE <live owner of anchor_schema> IN SCHEMA s, so objects the owner creates
    # later reach the runtime too. Expected once the transfer is in force (owner_transfer_key registered
    # AND anchor_schema owned by owner_role), or from runtime_privileges_from when set.
    runtime_privileges:
      booking:
        schemas: [booking]
        objects: {relation: [SELECT], sequence: [USAGE], function: [EXECUTE]}
        default_acl: {tables: [DELETE, INSERT, SELECT, UPDATE], sequences: [SELECT, USAGE], functions: [EXECUTE]}
    job_table: booking.job
    job_kind_prefix: bk_
    idle_exempt_kinds: [bk_inquiry_pull] # always queued at +60 s (bk-002 intake, Booking intake.RECURRING)
    set_local_roles: []
    role_lint_from: 14
    consumer_grants: []

  tripplanner:
    repo: AA-TripPlanner-Web
    path: migrations
    key_prefix: tp-
    anchor_schema: tripplanner
    schemas: [tripplanner]
    owner_role: tp_owner                 # X1 S3 (rl-001) + S7 (tp-013)
    owner_role_today: aa_cis_admin
    owner_transfer_key: tp-013
    runtime_roles: [tripplanner]         # browse + assembly Lambdas
    runtime_roles_today: [tripplanner]
    runtime_secrets: {tripplanner: tripplanner/dev/database-url}
    # What each runtime role must hold in its schemas (isolation probe cells runtime_grants.<owner> and
    # default_acl.<owner>, X1 review S241): `objects` on every existing object (plus USAGE on each schema;
    # sequences other than identity sequences, functions other than trigger functions), `default_acl`
    # from pg_default_acl FOR ROLE <live owner of anchor_schema> IN SCHEMA s, so objects the owner creates
    # later reach the runtime too. Expected once the transfer is in force (owner_transfer_key registered
    # AND anchor_schema owned by owner_role), or from runtime_privileges_from when set.
    runtime_privileges:
      tripplanner:
        schemas: [tripplanner]
        objects: {relation: [SELECT], sequence: [USAGE], function: [EXECUTE]}
        default_acl: {tables: [DELETE, INSERT, SELECT, UPDATE], sequences: [SELECT, USAGE]}   # no functions (tp-008)
    job_table: null                      # tripplanner.job comes with AA-861 (job template)
    job_kind_prefix: tp_
    idle_exempt_kinds: []
    set_local_roles: []
    role_lint_from: 13
    consumer_grants:
      - {grantee: booking, privilege: "USAGE, SELECT", object: tripplanner.v_inquiry_outbox, status: contract, source: "tp-009"}

  roles:
    # Infra-native (no owner repo): role bootstrap (LOGIN/NOLOGIN roles, attributes, memberships,
    # connection limits, MIG-6), CREATE/ALTER/DROP EXTENSION, public.* leftovers, and the prepared
    # undo files of the X1 ownership transfers. Always runs as master_role; DB Migrate refuses a
    # roles/ file under any other login.
    repo: AA-CIS-Infra
    path: db/migrations/roles
    key_prefix: rl-
    native: true
    runs_as: master
