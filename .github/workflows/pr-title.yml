name: PR title
# AA-1024 G11 (S272): the AA-890 check of the app repos, now in Infra too (Infra #255 closed an issue by title).
# With squash merges the PR title becomes the commit subject on main, so it follows "<type>: <description>" (types
# below, optional scope). Three Linear rules (lessons S243-S246):
#   - no issue id anywhere in the title ("fix: AA-123" reads as a closing phrase, "[AA-123]" too);
#   - no closing keyword in the body ("Fixes AA-123", "Closes AA-123", ...): Linear closes the issue on merge;
#   - no issue id in the body that its "Refs AA-<n>, ..." line does not name: Linear links every id it sees and its Git
#     automation moved linked issues to Done on merge.
# Bot PRs (Dependabot, the CI bot's release / schema PRs, bot/* and release-please branches; by login, not by
# user.type: the orchestrator's App is a Bot too) skip only the last rule: generated bodies cite issues.
# An id the Refs line names may appear anywhere in the body; an id inside a file path is ignored. The Refs line is
# "Refs AA-<n>[, AA-<m>...]" at the start of a line and may go on with free text ("Refs AA-1040 (EU AI Act ...).").
# Same rules as the root repo's pr-title.yml and the orchestrator's PR opener (tools/github in the root repo).
#
# Free: one short job per PR event, no checkout, no secrets beyond the default read-only token.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conventional title without an issue id
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            ci
            test
            perf
          requireScope: false
          subjectPattern: ^(?!.*\bAA-\d+\b).+$
          subjectPatternError: |
            The title "{title}" carries a Linear issue id. Remove it from the title and put
            "Refs AA-..." in the PR body instead.

      - name: Linear ids only on the Refs line, no closing keywords
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: python3 {0}
        run: |
          # Same rule as stray_issue_ids() of the root repo's PR opener (tools/github); keep the two in step.
          import os, re, sys
          body = os.environ.get("BODY", "").replace("\r", "")
          lines = body.splitlines()
          closing = re.compile(r"(?<![0-9A-Za-z])(close[sd]?|closing|fix(e[sd])?|fixing|resolve[sd]?|resolving"
                               r"|complete[sd]?|completing)[\s:*_`\[(\-]*(?:(?:https?://)?linear\.app/\S*?/issue/)?AA-\d+", re.IGNORECASE)
          hits = [line for line in lines if closing.search(line)]
          if hits:
              print("\n".join(hits[:5]))
              print("::error title=Linear keyword::Use 'Refs AA-123' in the PR body. Closing keywords make Linear "
                    "close the issue on merge; an issue is Done only after deploy and a live check.")
              sys.exit(1)
          # Generated bodies of the dependency / release / schema bots cite issues for context. The orchestrator's
          # App (aa-agent[bot]) is NOT exempt: its PRs are the ones this rule is for.
          bots = {"dependabot[bot]", "github-actions[bot]", "aa-ecosys-ci-bot[bot]"}
          head = os.environ.get("HEAD_REF", "")
          if os.environ.get("AUTHOR", "") in bots or head.startswith(("bot/", "release-please--")):
              print("Bot PR: issue ids beyond the Refs line are not checked.")
              sys.exit(0)
          issue = re.compile(r"\bAA-\d+\b")
          # The Refs line: "Refs AA-<n>[, AA-<m>...]" at the start of a line, then any free text; its ids are the
          # leading list only. An id in the free text that the list lacks is stray like any other.
          refs_lead = re.compile(r"^\s*Refs\s+(AA-\d+(?:\s*,\s*AA-\d+)*)\b")
          path_id = re.compile(r"[\w./-]*\bAA-\d+[\w-]*\.(?:md|py|json|ya?ml|sh|js|mjs|ts|tsx|sql|txt|html|toml)\b")
          refs, rest = set(), []
          for line in lines:
              m = refs_lead.match(line)
              if m:
                  refs.update(issue.findall(m.group(1)))
                  line = line[m.end():]
              rest.append(line)
          stray = [line for line in rest if any(x not in refs for x in issue.findall(path_id.sub(" ", line)))]
          if stray:
              print("\n".join(stray[:5]))
              print("::error title=Linear id not on the Refs line::The body names an issue that the 'Refs AA-<n>, ...' "
                    "line does not. Linear links every id in the body and may move it to Done on merge: add it to "
                    "Refs only if this PR does that issue, else describe the other work in words.")
              sys.exit(1)
          print("Body OK: no closing keyword; every issue id is on the Refs line (or in a file path).")
