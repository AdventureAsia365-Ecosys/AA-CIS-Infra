name: Terraform Apply Prod

on:
  workflow_dispatch:
    inputs:
      # AA-846: plan guard. The apply is refused when the plan changes a guarded resource type
      # (aws_secretsmanager_secret_version, random_password, aws_db_instance), see
      # tools/terraform/plan_guard.py. Set both inputs to let an intended change through.
      allow_guarded:
        description: "Allow changes to guarded types (secret versions, random_password, RDS instance)"
        type: boolean
        default: false
      allow_reason:
        description: "Required with allow_guarded: why (echoed to the job summary)"
        type: string
        default: ""
      guard_selftest:
        description: "Self-test only: run the plan guard on the committed guarded fixture (expect a red run), no AWS access"
        type: boolean
        default: false
      # AA-1004: which root to apply. aa365 = job terraform-apply (environment prod); management = job
      # terraform-apply-management (environment org, required reviewer; accounts/management/README.md §11).
      # guard_selftest always runs in the aa365 job (no AWS step, whatever the root).
      root:
        description: "Terraform root: aa365 (environment prod) or management (environment org, needs a reviewer)"
        type: choice
        options: [aa365, management]
        default: aa365

# One apply at a time across both roots (one Terraform process; the plans never race a lock).
concurrency:
  group: terraform-apply-prod
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply (prod)
    runs-on: ubuntu-latest
    environment: prod
    # AA-866: main only. Main-only is enforced by the IAM ref condition on the apply role; this job
    # guard is the second layer. Environment rules tracked in Linear AA-873 (TL-7).
    # AA-1004: root = management runs the job below instead (a self-test still runs here).
    if: github.ref == 'refs/heads/main' && (inputs.root != 'management' || inputs.guard_selftest)

    # AA-893: true only after a real apply that changed something (read by docs-gen-dispatch below).
    # A failed apply fails this job, so docs-gen-dispatch (needs: success) does not run then.
    outputs:
      changed: ${{ steps.plan.outputs.exitcode == '2' && inputs.guard_selftest != true }}

    defaults:
      run:
        working-directory: accounts/aa365

    env:
      TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
      # AA-846: plan guard inputs, passed via env (never interpolated into a script).
      GUARD_SELFTEST: ${{ inputs.guard_selftest && 'true' || 'false' }}
      ALLOW_GUARDED: ${{ inputs.allow_guarded && 'true' || 'false' }}
      ALLOW_REASON: ${{ inputs.allow_reason }}

    steps:
      - uses: actions/checkout@v7

      # AA-846: fail fast, before any AWS step, when allow_guarded comes without a reason.
      - name: Check guard inputs
        run: |
          if [ "$ALLOW_GUARDED" = "true" ] && [ "$GUARD_SELFTEST" != "true" ] && [ -z "$(printf '%s' "$ALLOW_REASON" | tr -d '[:space:]')" ]; then
            echo "allow_guarded=true needs a non-empty allow_reason" >&2
            exit 1
          fi

      # AA-846 self-test: feed the committed synthetic plan (it changes all three guarded types) to the
      # same guard step the real apply uses. Expected result: this run goes red at "Plan guard" with
      # REFUSED. Every AWS / Terraform step below is skipped in self-test mode.
      - name: Select self-test plan
        if: env.GUARD_SELFTEST == 'true'
        run: echo "PLAN_JSON=$GITHUB_WORKSPACE/tools/terraform/tests/fixtures/plan_guarded.json" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC)
        if: env.GUARD_SELFTEST != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        if: env.GUARD_SELFTEST != 'true'
        run: aws sts get-caller-identity

      - name: Setup Terraform
        if: env.GUARD_SELFTEST != 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"

      - name: Terraform Init
        if: env.GUARD_SELFTEST != 'true'
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Validate
        if: env.GUARD_SELFTEST != 'true'
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: env.GUARD_SELFTEST != 'true'
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode
        continue-on-error: true

      - name: Check plan exit code
        if: env.GUARD_SELFTEST != 'true'
        run: |
          EXIT_CODE=${{ steps.plan.outputs.exitcode }}
          if [ "$EXIT_CODE" == "1" ]; then
            echo "Terraform plan failed"
            exit 1
          elif [ "$EXIT_CODE" == "0" ]; then
            echo "No changes to apply"
          elif [ "$EXIT_CODE" == "2" ]; then
            echo "Changes detected, checking the plan guard before applying..."
          else
            echo "Unexpected plan exit code: '$EXIT_CODE'" >&2
            exit 1
          fi

      # AA-846: plan JSON for the guard. terraform-bin is the real binary next to the
      # setup-terraform wrapper; the wrapper adds a "[command]..." line to stdout, which is not JSON.
      # The JSON holds sensitive values in clear text: it stays in RUNNER_TEMP, is never printed or
      # uploaded, and is deleted right after the guard.
      - name: Export plan JSON
        if: env.GUARD_SELFTEST != 'true' && steps.plan.outputs.exitcode == '2'
        run: |
          umask 077
          if ! command -v terraform-bin >/dev/null; then
            echo "terraform-bin not found (setup-terraform wrapper layout changed?); refusing to apply" >&2
            exit 1
          fi
          terraform-bin show -json tfplan > "$RUNNER_TEMP/tfplan.json"
          echo "PLAN_JSON=$RUNNER_TEMP/tfplan.json" >> "$GITHUB_ENV"

      - name: Plan guard
        if: env.GUARD_SELFTEST == 'true' || steps.plan.outputs.exitcode == '2'
        working-directory: ${{ github.workspace }}
        run: |
          REASON=""
          if [ "$ALLOW_GUARDED" = "true" ] && [ "$GUARD_SELFTEST" != "true" ]; then
            REASON="$ALLOW_REASON"
          fi
          set +e
          python3 tools/terraform/plan_guard.py "$PLAN_JSON" --allow-reason="$REASON" --summary "$GITHUB_STEP_SUMMARY"
          RC=$?
          set -e
          if [ "$GUARD_SELFTEST" != "true" ]; then rm -f "$PLAN_JSON"; fi
          exit $RC

      # Reached only when the guard passed. In self-test mode that means the guard accepted a plan
      # that changes guarded types, so the guard is broken.
      - name: Self-test result
        if: env.GUARD_SELFTEST == 'true'
        run: |
          echo "SELF-TEST FAILED: the plan guard accepted the guarded fixture" | tee -a "$GITHUB_STEP_SUMMARY" >&2
          exit 1

      - name: Terraform Apply
        if: env.GUARD_SELFTEST != 'true' && steps.plan.outputs.exitcode == '2'
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Print outputs
        if: env.GUARD_SELFTEST != 'true' && steps.plan.outputs.exitcode == '2'
        run: terraform output

  # AA-1004: the management account root (accounts/management/README.md §11), in two jobs so nobody approves blind:
  #
  #   plan-management              no environment, read-only role aa-terraform-plan (sub ref:refs/heads/main). Writes
  #                                the masked plan summary the reviewer reads, and outputs a digest (SHA-256 of the
  #                                sorted planned address/action list, no values).
  #   terraform-apply-management   environment `org`: its required reviewer (the tech lead) approves after reading that
  #                                summary. Checks first that `org` really carries a required reviewer and a branch
  #                                policy (an environment GitHub auto-created by a first run has neither), then
  #                                re-plans with aa-terraform-apply and FAILS if the digest differs from the reviewed
  #                                one. Then the plan guard, then the apply of exactly that saved plan.
  #
  # Role ARNs and the state bucket are built from the repo secret MGMT_ACCOUNT_ID; the inputs come from MGMT_TFVARS.
  # This root's plan and apply text never reach the public log (e-mail addresses, member account ids): Terraform runs
  # with -json into RUNNER_TEMP and tools/terraform/drift_report.py writes only addresses (identity-store keys
  # redacted), actions and masked errors to the job summary. No `terraform output` either. The plan guard refuses,
  # besides the aa365 types, any delete, replace or forget of an organization, OU, account, SCP (or its attachment),
  # trail, trail bucket policy or Identity Center resource, and an organization update that drops a policy type or a
  # trusted-access principal.
  plan-management:
    name: Terraform Plan (management, for review)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && inputs.root == 'management' && !inputs.guard_selftest
    timeout-minutes: 20

    outputs:
      digest: ${{ steps.plan.outputs.digest }}

    defaults:
      run:
        working-directory: accounts/management

    env:
      ROOT: accounts/management
      TF_IN_AUTOMATION: "1"

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write management inputs (masked)
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
          MGMT_TFVARS: ${{ secrets.MGMT_TFVARS }}
        run: |
          if [ -z "$MGMT_ACCOUNT_ID" ] || [ -z "$MGMT_TFVARS" ]; then
            echo "::error::secrets MGMT_ACCOUNT_ID / MGMT_TFVARS are not set (accounts/management/README.md §11)"
            exit 1
          fi
          umask 077
          F="$RUNNER_TEMP/management.tfvars"
          printf '%s\n' "$MGMT_TFVARS" > "$F"
          for v in $(grep -oE '[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$F" | sort -u); do
            echo "::add-mask::$v"
          done
          if grep -qE '^[[:space:]]*aws_profile[[:space:]]*=' "$F"; then
            echo "::error::MGMT_TFVARS sets aws_profile; CI runs on OIDC credentials, remove that line from the secret"
            exit 1
          fi
          echo "TF_CLI_ARGS_plan=-var-file=$F" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC, management plan role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MGMT_ACCOUNT_ID }}:role/aa-terraform-plan
          aws-region: us-west-1
          role-duration-seconds: 3600

      - name: Verify the role is the management plan role
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-terraform-plan/*) echo "role: aa-terraform-plan" ;;
            *) echo "::error::the review plan must run with the read-only role aa-terraform-plan"; exit 1 ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Terraform Init
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=aa-tfstate-${MGMT_ACCOUNT_ID}-usw1" \
            -backend-config="key=management/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Terraform Plan (for review)
        id: plan
        run: |
          umask 077
          LOG="$RUNNER_TEMP/management-plan.jsonl"
          DIGEST="$RUNNER_TEMP/plan-digest.txt"
          trap 'rm -f "$LOG"' EXIT
          set +e
          terraform plan -input=false -detailed-exitcode -json > "$LOG"
          RC=$?
          set -e
          echo "terraform plan exit code: $RC"
          python3 -B "$GITHUB_WORKSPACE/tools/terraform/drift_report.py" --mode plan --plan-log "$LOG" \
            --exit-code "$RC" --root "$ROOT" --summary "$GITHUB_STEP_SUMMARY" --digest-out "$DIGEST"
          echo "digest=$(cat "$DIGEST")" >> "$GITHUB_OUTPUT"
          echo "Approve the \`org\` deployment only if the list above is what you expect." >> "$GITHUB_STEP_SUMMARY"

  terraform-apply-management:
    name: Terraform Apply (management)
    needs: plan-management
    runs-on: ubuntu-latest
    environment: org
    if: github.ref == 'refs/heads/main' && inputs.root == 'management' && !inputs.guard_selftest
    timeout-minutes: 30

    # actions: read for the environment check below (GET repos/{repo}/environments/org with GITHUB_TOKEN).
    permissions:
      id-token: write
      contents: read
      actions: read

    defaults:
      run:
        working-directory: accounts/management

    env:
      ROOT: accounts/management
      TF_IN_AUTOMATION: "1"
      ALLOW_GUARDED: ${{ inputs.allow_guarded && 'true' || 'false' }}
      ALLOW_REASON: ${{ inputs.allow_reason }}
      REVIEWED_DIGEST: ${{ needs.plan-management.outputs.digest }}

    steps:
      # Before any secret or credential: if `org` was auto-created by a run (no protection rules) or lost its reviewer,
      # this job is already running unreviewed; stop it here.
      - name: Check the org environment is protected
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          RULES=$(gh api "repos/$REPO/environments/org" \
            --jq '[([.protection_rules[]? | select(.type == "required_reviewers" and ((.reviewers // []) | length) > 0)] | length > 0), (.deployment_branch_policy != null)] | @tsv')
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "::error::cannot read the org environment (gh api exit $RC); refusing to apply"
            exit 1
          fi
          REVIEWERS=$(cut -f1 <<<"$RULES")
          BRANCHES=$(cut -f2 <<<"$RULES")
          if [ "$REVIEWERS" != "true" ] || [ "$BRANCHES" != "true" ]; then
            echo "::error::environment org must have a required reviewer and a deployment branch policy (README §11.2); refusing to apply"
            exit 1
          fi
          echo "org environment: required reviewer and branch policy present"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check guard inputs
        run: |
          if [ "$ALLOW_GUARDED" = "true" ] && [ -z "$(printf '%s' "$ALLOW_REASON" | tr -d '[:space:]')" ]; then
            echo "allow_guarded=true needs a non-empty allow_reason" >&2
            exit 1
          fi
          if ! grep -qE '^[0-9a-f]{64}$' <<<"$REVIEWED_DIGEST"; then
            echo "::error::no reviewed plan digest from plan-management; refusing to apply"
            exit 1
          fi

      # Fails (not skips) when the wiring is missing: a dispatched apply must never look green without running.
      - name: Write management inputs (masked)
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
          MGMT_TFVARS: ${{ secrets.MGMT_TFVARS }}
        run: |
          if [ -z "$MGMT_ACCOUNT_ID" ] || [ -z "$MGMT_TFVARS" ]; then
            echo "::error::secrets MGMT_ACCOUNT_ID / MGMT_TFVARS are not set (accounts/management/README.md §11)"
            exit 1
          fi
          umask 077
          F="$RUNNER_TEMP/management.tfvars"
          printf '%s\n' "$MGMT_TFVARS" > "$F"
          for v in $(grep -oE '[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$F" | sort -u); do
            echo "::add-mask::$v"
          done
          if grep -qE '^[[:space:]]*aws_profile[[:space:]]*=' "$F"; then
            echo "::error::MGMT_TFVARS sets aws_profile; CI runs on OIDC credentials, remove that line from the secret"
            exit 1
          fi
          echo "TF_CLI_ARGS_plan=-var-file=$F" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC, management apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MGMT_ACCOUNT_ID }}:role/aa-terraform-apply
          aws-region: us-west-1
          role-duration-seconds: 3600

      - name: Verify the role is the management apply role
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-terraform-apply/*) echo "role: aa-terraform-apply" ;;
            *) echo "::error::the management apply must run with the role aa-terraform-apply"; exit 1 ;;
          esac

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false   # real exit codes, clean JSON on stdout

      - name: Terraform Init
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=aa-tfstate-${MGMT_ACCOUNT_ID}-usw1" \
            -backend-config="key=management/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Terraform Validate
        run: terraform validate -no-color

      # Re-plan with the apply role and compare with the plan the reviewer approved: a different address/action list
      # (state or inputs changed in between, or a different commit) fails here, before the guard and the apply.
      - name: Terraform Plan
        id: plan
        run: |
          umask 077
          LOG="$RUNNER_TEMP/management-plan.jsonl"
          DIGEST="$RUNNER_TEMP/plan-digest.txt"
          trap 'rm -f "$LOG"' EXIT
          set +e
          terraform plan -input=false -detailed-exitcode -out="$RUNNER_TEMP/tfplan" -json > "$LOG"
          RC=$?
          set -e
          echo "exitcode=$RC" >> "$GITHUB_OUTPUT"
          echo "terraform plan exit code: $RC"
          python3 -B "$GITHUB_WORKSPACE/tools/terraform/drift_report.py" --mode plan --plan-log "$LOG" \
            --exit-code "$RC" --root "$ROOT" --summary "$GITHUB_STEP_SUMMARY" --digest-out "$DIGEST"
          if [ "$(cat "$DIGEST")" != "$REVIEWED_DIGEST" ]; then
            echo "::error::the plan differs from the reviewed plan (digest mismatch); nothing applied, dispatch again"
            exit 1
          fi
          echo "plan matches the reviewed plan"

      - name: Export plan JSON
        if: steps.plan.outputs.exitcode == '2'
        run: |
          umask 077
          terraform show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/tfplan.json"
          echo "PLAN_JSON=$RUNNER_TEMP/tfplan.json" >> "$GITHUB_ENV"

      - name: Plan guard
        if: steps.plan.outputs.exitcode == '2'
        working-directory: ${{ github.workspace }}
        run: |
          REASON=""
          if [ "$ALLOW_GUARDED" = "true" ]; then REASON="$ALLOW_REASON"; fi
          set +e
          python3 tools/terraform/plan_guard.py "$PLAN_JSON" --allow-reason="$REASON" --summary "$GITHUB_STEP_SUMMARY"
          RC=$?
          set -e
          rm -f "$PLAN_JSON"
          exit $RC

      - name: Terraform Apply
        if: steps.plan.outputs.exitcode == '2'
        run: |
          umask 077
          LOG="$RUNNER_TEMP/management-apply.jsonl"
          trap 'rm -f "$LOG" "$RUNNER_TEMP/tfplan"' EXIT
          set +e
          terraform apply -input=false -auto-approve -json "$RUNNER_TEMP/tfplan" > "$LOG"
          RC=$?
          set -e
          echo "terraform apply exit code: $RC"
          python3 -B "$GITHUB_WORKSPACE/tools/terraform/drift_report.py" --mode apply --plan-log "$LOG" \
            --exit-code "$RC" --root "$ROOT" --summary "$GITHUB_STEP_SUMMARY"

  # AA-893: regenerate the infra docs (root docs/generated/: alarms, network, inventory, IAM) from the
  # new state. A separate job so `actions: write` (needed to dispatch a workflow) never reaches the apply
  # job, which holds the DB password and the near-admin apply credentials and runs provider binaries.
  # No checkout, no environment, no AWS step; docs-gen.yml itself uses the read-only plan role.
  # The apply already succeeded, so a failed dispatch only warns (the nightly run catches up).
  docs-gen-dispatch:
    name: Dispatch Docs Gen
    needs: terraform-apply
    if: needs.terraform-apply.outputs.changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Regenerate the infra docs (Docs Gen)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APPLY_RUN: ${{ github.run_id }}
        run: |
          gh workflow run docs-gen.yml --repo "$REPO" --ref main \
            -f reason="after Terraform Apply (run $APPLY_RUN)"
          echo "- dispatched Docs Gen (root docs/generated PR if a page changed)" >> "$GITHUB_STEP_SUMMARY"
