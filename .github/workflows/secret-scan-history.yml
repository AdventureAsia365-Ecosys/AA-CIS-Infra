name: Secret Scan (full history)
# AA-981: this repo is public (22/10/2026), so every commit of every branch and every pull request head
# is readable. Job `gitleaks full history`: every commit of every branch and tag, plus the head of every
# pull request (`refs/pull/*/head`: GitHub keeps them, closed PRs included, after the branch is deleted,
# and anyone can fetch them), with the default rules plus .gitleaks.toml. Findings that were already in
# history are pinned by commit fingerprint in .gitleaksignore, so the job is green today and red on
# anything new. On workflow_dispatch the job `gitleaks working tree` also scans the working tree of the
# chosen ref (untracked build outputs included); run both on a branch to test a new finding.
# The PR check `gitleaks`, the guarded files and the scan options are in the header of secret-scan.yml;
# local commands: README.md, "Secret scan".
# This workflow never runs on pull_request, and no job here is named `gitleaks`: a manual run on a PR
# branch must not leave a skipped `gitleaks` check on the PR head (a skipped check counts as passed for
# a required check). A change to this file needs the label `secret-scan-baseline-reviewed`.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 19 * * *" # 02:23 in Vietnam
  workflow_dispatch:

concurrency:
  group: secret-scan-history-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest).
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  history:
    name: gitleaks full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit of every branch and tag
          persist-credentials: false # the checkout is mounted into the gitleaks container

      - name: Fetch the head of every pull request
        # Closed PRs included: GitHub keeps refs/pull/N/head after the branch is deleted, and they are public. No
        # token is stored in the checkout (persist-credentials: false): the repo is public, so the fetch needs none.
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan the full git history
        run: |
          set +e
          echo "Scanning $(git rev-list --all | wc -l) commits on $(git for-each-ref refs/remotes refs/tags | wc -l) refs (branches, tags, PR heads)"
          # gitleaks cannot read what a merge with three or more parents adds (remerge covers two parents only).
          octopus=$(git rev-list --all --min-parents=3 | xargs)
          if [ -n "$octopus" ]; then
            echo "::error title=gitleaks full history::Merge commits with three or more parents (${octopus}): the scan cannot read what they add. A reviewer reads each one by hand (git show --cc <sha>); the job stays red while one is reachable."
            exit 1
          fi
          # Read every file as text: `* diff` makes git show a file's lines even when it has a NUL byte or a
          # .gitattributes `binary` / `-diff`. UTF-16 files get their own pass below.
          mkdir -p .git/info && printf '* diff\n' > .git/info/attributes
          # gitleaks' own default log options are `--full-history --all --diff-filter=tuxdb`. Here: type changes are
          # scanned too (`uxdb`, a symlink turned into a file), a renamed file is read as a new file (`--no-renames`)
          # and a merge commit as its remerge diff (see the header of secret-scan.yml).
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --log-opts="--all --full-history --diff-filter=uxdb --diff-merges=remerge --no-renames" \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > scan.log 2>&1
          status=$?
          cat scan.log
          # UTF-16 text (Windows PowerShell 5.1 writes it by default) is invisible to the rules, which match bytes.
          # Every blob reachable from any ref that starts with a UTF-16 BOM (FF FE / FE FF) or is ASCII with every
          # other byte NUL is transcoded to UTF-8 with iconv and scanned as a file at its own path, <blob id>/<path>
          # (gitleaks dir: path rules apply; inline allows are ignored there). Same code as secret-scan.yml.
          cat > "$RUNNER_TEMP/utf16.py" <<'PY'
          import os, subprocess, sys
          out, n = sys.argv[1], 0
          cat = subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          for line in sys.stdin.buffer:  # git rev-list --objects: "<id> <path>"; commits and root trees have no path
              oid, _, path = line.rstrip(b"\n").partition(b" ")
              if not path:
                  continue
              cat.stdin.write(oid + b"\n"); cat.stdin.flush()
              hdr = cat.stdout.readline().split()
              if len(hdr) < 3:  # "<id> missing": the rest of a path with a newline in it
                  continue
              data = cat.stdout.read(int(hdr[2]) + 1)[:-1]
              if hdr[1] != b"blob":
                  continue
              h = data[:512]; pairs = len(h) // 2
              le = sum(1 for i in range(pairs) if h[2 * i + 1] == 0 and 9 <= h[2 * i] < 127)
              be = sum(1 for i in range(pairs) if h[2 * i] == 0 and 9 <= h[2 * i + 1] < 127)
              if h[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  enc = "UTF-16"
              elif pairs >= 4 and 4 * le >= 3 * pairs:
                  enc = "UTF-16LE"
              elif pairs >= 4 and 4 * be >= 3 * pairs:
                  enc = "UTF-16BE"
              else:
                  continue
              parts = [p for p in path.decode("utf-8", "replace").split("/") if p not in ("", ".", "..")]
              dst = os.path.join(out, oid.decode(), *parts)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(dst, "wb") as f:
                  subprocess.run(["iconv", "-c", "-f", enc, "-t", "UTF-8"], input=data, stdout=f)
              n += 1
          cat.stdin.close()
          if cat.wait():
              sys.exit(1)
          print(n)
          PY
          u16="$RUNNER_TEMP/gitleaks-utf16"
          mkdir -p "$u16"
          n16=$(set -o pipefail; git rev-list --objects --all | python3 -I "$RUNNER_TEMP/utf16.py" "$u16")
          u16fail=$?
          u16status=0
          : > utf16.log
          if [ "$u16fail" -eq 0 ] && [ "$n16" -gt 0 ]; then
            echo "Scanning ${n16} UTF-16 file(s), transcoded to UTF-8"
            docker run --rm -u "$(id -u):$(id -g)" -v "$u16:/u16:ro" -v "$PWD:/repo:ro" -w /u16 "$GITLEAKS_IMAGE" \
              dir . --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore --ignore-gitleaks-allow \
              --redact --verbose --no-banner --exit-code 1 > utf16.log 2>&1
            u16status=$?
            cat utf16.log
          fi
          # gitleaks logs a failed git command and still exits 0 with "no leaks found": treat that as a failure.
          gitfail=0
          if [ "$u16fail" -ne 0 ] || grep -qF -e 'stderr is not empty' -e '[git] fatal' scan.log; then
            gitfail=1
            echo "::error title=gitleaks full history::git failed inside the scan (see the log above), so the result is not valid."
          fi
          {
            echo '### Secret scan, full history (gitleaks)'
            if [ "$gitfail" -ne 0 ]; then
              echo 'git failed inside the scan, so it proves nothing. Rerun the job; see the log for the git error.'
            elif [ "$status" -eq 0 ] && [ "$u16status" -eq 0 ]; then
              echo 'No new secrets in history (known findings are pinned in `.gitleaksignore`).'
              echo "UTF-16 files scanned: ${n16}."
            else
              echo 'gitleaks found a secret in history that is not in the baseline (values redacted).'
              echo 'A real secret is public already (the repo is public; GitHub keeps PR heads and pushed commits'
              echo 'after a force-push or a deleted branch): rotate it first, even if the commit is gone from the'
              echo 'branch, then add its fingerprint to `.gitleaksignore` with a comment. A false positive: a narrow'
              echo 'allowlist entry in `.gitleaks.toml`, or its fingerprint in `.gitleaksignore`.'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Date|Fingerprint):' scan.log || true
              echo '```'
              echo 'UTF-16 files, transcoded (File is <blob id>/<path>; that fingerprint can be pinned):'
              echo '```'
              grep -E '^(RuleID|File|Line|Fingerprint):' utf16.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || [ "$u16status" -ne 0 ]; then
            echo "::error title=gitleaks full history::New secret-like finding in git history. Rotate it if real. See the job summary."
          fi
          [ "$gitfail" -ne 0 ] && exit 1
          [ "$status" -ne 0 ] && exit "$status"
          exit "$u16status"

  worktree:
    name: gitleaks working tree
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the checkout is mounted into the gitleaks container

      - name: Scan the working tree of the chosen ref
        run: |
          set +e
          echo "Scanning the working tree of ${GITHUB_REF}"
          # `dir .`, not `dir /repo`: relative paths keep the path allowlists anchored at ^ matching. The log goes
          # to the runner's temp folder, outside the scanned tree.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            dir . --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > "$RUNNER_TEMP/scan.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/scan.log"
          {
            echo '### Secret scan, working tree (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No secrets found.'
            else
              echo 'gitleaks reported findings (values redacted). A committed real value is public already:'
              echo 'rotate it, even after a force-push. A false positive: a narrow allowlist entry in `.gitleaks.toml`.'
              echo '```'
              grep -E '^(RuleID|File|Line|Fingerprint):' "$RUNNER_TEMP/scan.log" || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
