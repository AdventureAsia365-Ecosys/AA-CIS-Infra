name: Docs lint
# AA-888: the docs standard (AA-Ecosys docs/STYLE.md, AA-887) checked in this repo, with the tools vendored from the
# AA-Ecosys root repo (tools/docs/README.md says what is copied and how to keep the copies identical):
#   - front-matter of CONTEXT.md and docs/** against docs/templates/frontmatter.schema.json, unique IDs
#   - ADR status lines and the ADR index (docs/adr/README.md)
#   - no backslash-continued AWS CLI command in any tracked Markdown file (multi-line AWS CLI hangs WSL2)
#   - literal resource IDs in Markdown: VPC resource IDs (sg-, subnet-, vpc-, ...) and API Gateway hosts fail;
#     account IDs, ARNs and user-pool IDs only warn, because this private repo holds the account map (STYLE.md)
#   - internal links, offline (lychee): no network, no external sites; the binary comes from a cached, hash-checked
#     copy (.github/actions/lychee, S273), warmed on main by the lychee-cache job
# Weekly (and on demand): freshness report of pages past their review date, as a run artifact.
# gitleaks already runs on every PR in secret-scan.yml (and nightly over the full history in
# secret-scan-history.yml), so it is not repeated here.
#
# Cost: private repo, so runs count against the free Actions minutes. The PR job runs only when Markdown or the
# lint tools change (about 1 minute), plus one short job a week. No AWS, no secrets beyond the read-only token.
on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "tools/docs/**"
      - "docs/templates/**"
      - ".github/workflows/docs-lint.yml"
      - ".github/actions/lychee/**"
      - ".github/scripts/lychee_bin.py"
  # S273: a push to main that moves the lychee pin warms the cache entry every pull request reads (lychee-cache job).
  push:
    branches: [main]
    paths:
      - ".github/actions/lychee/**"
      - ".github/scripts/lychee_bin.py"
  schedule:
    - cron: "29 1 * * 1" # Mondays 01:29 UTC (08:29 in Vietnam), after the root repo's run
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Docs lint
    if: github.event_name != 'schedule' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('tools/docs/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install lint dependencies
        id: deps
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      # Every check below runs even when an earlier one failed, so one run shows all problems.
      - name: Unit tests of the lint tools
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python -m unittest discover -s tools/docs -p 'test_*.py'

      - name: Front-matter schema
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: python tools/docs/check_frontmatter.py

      - name: ADR status and index
        if: ${{ !cancelled() }}
        run: python tools/docs/check_adr_index.py docs/adr

      - name: Single-line AWS CLI
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py aws-multiline --all

      - name: Literal resource IDs (VPC IDs and API Gateway hosts fail, the rest warns)
        if: ${{ !cancelled() }}
        run: python tools/docs/check_docs_text.py resource-ids --all --mode warn --block vpc,apigw

      # The checkout has no .terraform or node_modules folders, so the glob only sees tracked pages.
      - name: Internal links (offline)
        # S273: the local action runs what lycheeverse/lychee-action v2.9.0 ran (lychee v0.24.2, same args and report),
        # with the binary from actions/cache (pinned sha256, .github/actions/lychee/pins.txt) instead of a one-shot
        # download from github.com on every run.
        if: ${{ !cancelled() }}
        uses: ./.github/actions/lychee
        with:
          args: --config tools/docs/lychee.toml './**/*.md'
          fail: true
          jobSummary: true

  # S273: actions/cache entries saved on the default branch are the only ones every pull request and merge-queue run
  # can read, and the Docs lint job runs on pull requests only. This job restores or downloads the pinned lychee binary
  # on main (push of a new pin, the weekly schedule, a manual run) and saves it; it runs no check.
  lychee-cache:
    name: Lychee cache (default branch)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore or fetch lychee
        uses: ./.github/actions/lychee
        with:
          install-only: "true"

  freshness:
    name: Docs freshness report
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # S273 (workflow_lint WL4): restore on every ref; only the default branch saves this cache
      # (a pull request or merge-queue copy is readable only by that ref).
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('tools/docs/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Install lint dependencies
        run: python -m pip install --quiet -r tools/docs/requirements.txt

      - name: Save pip cache
        if: github.ref == 'refs/heads/main' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Build the freshness report (warn-only)
        run: |
          python tools/docs/check_frontmatter.py --freshness-report freshness/freshness.md
          cat freshness/freshness.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: docs-freshness
          path: freshness/freshness.md
          retention-days: 30
