name: DB Schema Dump (shared RDS)
# AA-807 N1: regenerates AA-Ecosys docs/architecture/db-schema-reference.md from the live catalog.
#
# 1. A one-off ECS Fargate task (the migrator task definition, X1 S12: a revision of
#    aa-cis-dev-db-migrate with the CIS api service's current image, registered by
#    .github/scripts/migrator-task.sh and deregistered at the end; api subnets, security group
#    aa-cis-dev-sg-db-migrate, the same DATABASE_URL as DB Migrate: db_migrator since X1 S22, the RDS master
#    before; first task line `DUMP login=<role>`) runs db/schema_dump.py: read-only (default_transaction_read_only + one REPEATABLE READ READ ONLY
#    transaction), catalog queries only, no row values. It writes JSON to the bronze bucket with the
#    task role: columns, indexes, constraints, policies, table + column grants, owners, default
#    privileges, roles, functions, sizes, pg_stat_user_tables activity, sessions per
#    application_name, shared.schema_versions, and the orphan counts of cross-app soft keys
#    (data standards DM-4.2, AA-830: aggregate counts only; a warning when a key has orphans).
# 2. db/gen_schema_reference.py renders the Markdown here on the runner, including the X2 RLS catalogue guard
#    section (db/rls_catalogue_rules.py, a byte copy of the CIS CI guard's rules; violations are warnings here).
#    db/gen_erd.py (AA-894 part 1) renders, from the same JSON, one Mermaid ERD page per schema plus an index
#    (root docs/architecture/erd/) and erd.json (tables, columns, PK/FK, DM-6.1 tags, owner; no row data). Both are
#    in the run artifact; erd.json also goes to s3://<bronze>/data-model/erd/latest.json (scope 2: read by the CIS
#    admin data-model view, the CIS task role may read exactly latest.json + previous.json, modules/ecs ReadErdModel)
#    unless the repo variable ERD_S3_UPLOAD is 'false'. When the model changed, the object it replaces is kept as
#    previous.json ("changed since the previous dump").
# 3. If the STRUCTURE changed (fingerprint in the file differs from the root repo's master, an ERD page differs from
#    master, or publish=true), the reference and the ERD pages are pushed to the root repo branch
#    bot/db-schema-reference and a PR is opened or updated. Nightly runs where only statistics moved open nothing.
#    The root PR is merged by hand (root repo rule).
# 4. db/check_erd_drift.py (AA-894 scope 3) compares the hand-written design ERDs of the root repo
#    (docs/architecture/erd/design/<schema>.md on master) with erd.json and writes a drift report to the step summary;
#    it fails only for a live schema whose design page is marked enforce=true.
#
# Triggers: nightly, manual, and DB Migrate after every successful apply (gh workflow run).
# Root repo access (AA-901, root ADR 0011): a short-lived installation token of the GitHub App aa-ecosys-ci-bot,
# minted right before the root checkout (after every AWS step that produces the dump) for AdventureAsia365-Ecosys/AA-Ecosys
# only, Contents write + Pull requests write; revoked when the job ends. Needs the repo variable AA_CI_BOT_APP_ID and
# the repo secret AA_CI_BOT_PRIVATE_KEY (repo level: this private repo on GitHub Free has no environment branch rule,
# so the job's main-only guard is what keeps the key off other refs). Without them the dump and the artifact still
# run and the publish step fails with a clear error.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run (shown in the root PR); DB Migrate sets it after an apply"
        required: false
        type: string
        default: manual
      publish:
        description: "Open/update the root PR even if only statistics changed"
        required: false
        type: boolean
        default: false
      design_ref:
        description: "AA-894: root branch whose design ERD pages the drift step checks (default master). A test branch here proves the check green/red without merging a design page"
        required: false
        type: string
        default: ""
  schedule:
    - cron: "43 3 * * *"   # nightly, 03:43 UTC

# Own group: never queued behind or ahead of a DB Migrate run (a pending run in a shared group would
# cancel a pending migration). A dump that meets a migration's exclusive lock fails on lock_timeout.
concurrency:
  group: db-schema-dump
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  dump:
    name: Dump schema, regenerate reference
    runs-on: ubuntu-latest
    # Same OIDC subject as DB Migrate (environment:prod -> aa-cis-infra-tf-apply). If a required
    # reviewer is ever added to `prod`, the nightly run waits for approval: give the dump its own
    # read-only role and environment then (AA-807 X1).
    environment: prod
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    env:
      AWS_REGION: us-west-1
      CLUSTER: aa-cis-dev-cluster
      SERVICE: aa-cis-dev-api
      BUCKET: aa-cis-bronze-005097885195
      LOG_GROUP: /ecs/aa-cis-dev
      ROOT_REPO: AdventureAsia365-Ecosys/AA-Ecosys
      ROOT_BRANCH: master
      PR_BRANCH: bot/db-schema-reference
      REF_PATH: docs/architecture/db-schema-reference.md
      ERD_DIR: docs/architecture/erd
      # AA-894: erd.json upload for the CIS admin data-model view (AA-CIS-App GET /admin/data-model). On unless the
      # repo variable ERD_S3_UPLOAD is 'false'. The CI role already writes this bucket (db-schema-dump/latest.json).
      # Own prefix, not db-schema-dump/: the migrator task role may put db-schema-dump/* and the CIS task role is
      # denied that prefix (the full dumps); CIS may read only data-model/erd/{latest,previous}.json (modules/ecs).
      ERD_S3_UPLOAD: ${{ vars.ERD_S3_UPLOAD != 'false' && 'true' || 'false' }}
      ERD_S3_PREFIX: data-model/erd
      REASON: ${{ github.event_name == 'schedule' && 'nightly' || inputs.reason || 'manual' }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
      HAS_CI_BOT_APP: ${{ vars.AA_CI_BOT_APP_ID != '' && secrets.AA_CI_BOT_PRIVATE_KEY != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      # PyYAML for the owners.yaml mirror test (db/tests/test_owners_registry.py); same pin as the
      # Migration Copy Guard. Without it that module is skipped, not failed.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests (runner, dump assembly, generator)
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python -m unittest discover -s db/tests

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # X1 S12: a revision of aa-cis-dev-db-migrate with the api service's current image (deregistered
      # by the last step). Its task role may put only db-schema-dump/* (accounts/aa365/db_migrator.tf).
      - name: Register the migrator revision (api image)
        id: td
        run: bash .github/scripts/migrator-task.sh prepare

      # Presigned URL created and used in this one step (a masked step output can be dropped).
      - name: Upload dump script, run one-off ECS task
        id: task
        run: |
          PREFIX="db-schema-dump/${{ github.run_id }}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          aws s3 cp db/schema_dump.py "s3://$BUCKET/$PREFIX/schema_dump.py" --only-show-errors
          RUNNER_URL=$(aws s3 presign "s3://$BUCKET/$PREFIX/schema_dump.py" --expires-in 900)
          echo "::add-mask::$RUNNER_URL"

          TASK_DEF="${{ steps.td.outputs.arn }}"
          NET='${{ steps.td.outputs.network }}'
          echo "task definition: $TASK_DEF (image of ${{ steps.td.outputs.api_task_definition }})"
          OVERRIDES=$(jq -nc \
            --arg runner "$RUNNER_URL" --arg bucket "$BUCKET" --arg key "$PREFIX/schema.json" \
            '{containerOverrides: [{name: "migrate",
              command: ["python3", "-c", "import os,urllib.request;exec(urllib.request.urlopen(os.environ[\"RUNNER_URL\"],timeout=30).read())"],
              environment: [
                {name: "RUNNER_URL", value: $runner}, {name: "DUMP_BUCKET", value: $bucket},
                {name: "DUMP_KEY", value: $key}]}]}')
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEF" \
            --launch-type FARGATE --network-configuration "$NET" --overrides "$OVERRIDES" \
            --started-by "gh-db-schema-dump-${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)
          [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ] || { echo "::error::run-task returned no task"; exit 1; }
          echo "task: $TASK_ARN"
          echo "arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          # The waiter gives up after 10 min; retry it so a slow start does not fail the step.
          for i in 1 2 3; do aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN" && break; done

      - name: Task log + result
        if: always() && steps.task.outputs.arn != ''
        env:
          TASK_ARN: ${{ steps.task.outputs.arn }}
        run: |
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "migrate/migrate/$TASK_ID" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' | tee task.log || true
          grep '^DUMP' task.log >> "$GITHUB_STEP_SUMMARY" || true
          DESC=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --output json)
          EXIT=$(jq -r '.tasks[0].containers[] | select(.name=="migrate") | .exitCode' <<<"$DESC")
          echo "exit code: $EXIT  stopped: $(jq -r '.tasks[0].stoppedReason' <<<"$DESC")"
          [ "$EXIT" = "0" ] || { echo "::error::schema dump task exited with $EXIT"; exit 1; }

      - name: Fetch the dump, render the reference
        id: render
        run: |
          PREFIX="${{ steps.task.outputs.prefix }}"
          aws s3 cp "s3://$BUCKET/$PREFIX/schema.json" schema.json --only-show-errors
          aws s3 cp schema.json "s3://$BUCKET/db-schema-dump/latest.json" --only-show-errors
          python3 db/gen_schema_reference.py schema.json --out reference.md \
            --source "AA-CIS-Infra DB Schema Dump ($REASON), $RUN_URL"
          echo "fingerprint=$(python3 db/gen_schema_reference.py schema.json --fingerprint)" >> "$GITHUB_OUTPUT"
          # AA-894: generated ERD (one Mermaid page per schema + index) and erd.json, from the same dump.
          python3 db/gen_erd.py schema.json --out-dir erd --json erd.json \
            --source "AA-CIS-Infra DB Schema Dump ($REASON), $RUN_URL"
          {
            echo "### Schema dump ($REASON)"
            jq -r '"- latest: CIS \(.migrations_latest_per_owner.cis), TripPlanner \(.migrations_latest_per_owner.tripplanner), Booking \(.migrations_latest_per_owner.booking)",
                   "- \(.counts.schemas) schemas, \(.counts.relations) tables/views, \(.counts.indexes) indexes, \(.counts.policies) policies, \(.counts.functions) functions",
                   "- JSON: s3://'"$BUCKET"'/'"$PREFIX"'/schema.json (also db-schema-dump/latest.json)"' schema.json
            jq -r '(.soft_keys // [])[] | "- soft key \(.name): \(.status), rows \(.total // "-"), without key \(.without_key // "-"), orphans \(.orphans // "-")"' schema.json
            jq -r '"- ERD: \([.schemas[] | select(.tables | length > 0)] | length) schema page(s), \(.edges | length) FK edge(s), model `\(.fingerprint[0:12])`"' erd.json
          } >> "$GITHUB_STEP_SUMMARY"
          # DM-4.2: orphans are reported, not fatal (the dump must still publish); the annotation shows on the run.
          jq -r '(.soft_keys // [])[] | select((.orphans // 0) > 0) | "::warning::soft key \(.name): \(.orphans) orphan row(s) of \(.total - .without_key) keyed"' schema.json
          # X2 RLS catalogue guard (db/rls_catalogue_rules.py): violations are reported, not fatal, like the soft keys;
          # the rendered file carries the full section (violations + allowlist entries in use).
          python3 db/gen_schema_reference.py schema.json --rls-guard > rls-guard.txt
          grep -v '^::' rls-guard.txt >> "$GITHUB_STEP_SUMMARY"
          grep '^::' rls-guard.txt || true

      - name: Keep dump + rendered file as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: db-schema-dump-${{ github.run_id }}
          path: |
            schema.json
            reference.md
            erd.json
            erd/
          retention-days: 14

      # AA-894: on by default (repo variable ERD_S3_UPLOAD='false' turns it off). latest.json is what the CIS admin
      # view reads; previous.json is the model before the last structural change ("changed since the previous dump"),
      # so it is replaced only when the fingerprint moves and the view keeps showing the last change between them.
      - name: Upload erd.json to S3 (optional)
        if: env.ERD_S3_UPLOAD == 'true'
        run: |
          NEW_FP=$(jq -r .fingerprint erd.json)
          if aws s3 cp "s3://$BUCKET/$ERD_S3_PREFIX/latest.json" erd-prev.json --only-show-errors 2>/dev/null; then
            OLD_FP=$(jq -r '.fingerprint // empty' erd-prev.json || true)
            if [ -n "$OLD_FP" ] && [ "$OLD_FP" != "$NEW_FP" ]; then
              aws s3 cp erd-prev.json "s3://$BUCKET/$ERD_S3_PREFIX/previous.json" --only-show-errors \
                --content-type application/json
              echo "- erd.json: model changed (\`${OLD_FP:0:12}\` -> \`${NEW_FP:0:12}\`), previous kept" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          aws s3 cp erd.json "s3://$BUCKET/$ERD_S3_PREFIX/latest.json" --only-show-errors --content-type application/json
          echo "- erd.json: s3://$BUCKET/$ERD_S3_PREFIX/latest.json" >> "$GITHUB_STEP_SUMMARY"

      # AA-901: App installation token for the root repo only (the job runs on main only, see `if:` above).
      - name: Mint the aa-ecosys-ci-bot token (root repo, contents + pull requests write)
        id: app-token
        if: env.HAS_CI_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: AA-Ecosys
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the root repo
        id: root
        if: env.HAS_CI_BOT_APP == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ROOT_REPO }}
          ref: ${{ env.ROOT_BRANCH }}
          token: ${{ steps.app-token.outputs.token }}
          path: root
          fetch-depth: 1

      - name: Open or update the root PR when the structure changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_FP: ${{ steps.render.outputs.fingerprint }}
        run: |
          if [ "$HAS_CI_BOT_APP" != "true" ]; then
            echo "::error::the aa-ecosys-ci-bot App is not configured (repo variable AA_CI_BOT_APP_ID and/or secret AA_CI_BOT_PRIVATE_KEY missing): the dump is in the artifact and S3, but no root PR can be opened (see the header of this workflow)"
            exit 1
          fi
          OLD_FP=$(grep -oE 'schema-fingerprint: [0-9a-f]{64}' "root/$REF_PATH" | cut -d' ' -f2 || true)
          echo "fingerprint master=${OLD_FP:-none} dump=$NEW_FP"
          # AA-894: replace the generated ERD pages (only files written by this workflow; a hand-written design/
          # subdirectory is never touched), then see whether any page differs from master.
          mkdir -p "root/$ERD_DIR"
          { grep -lxF 'generator: infra/AA-CIS-Infra/.github/workflows/db-schema-dump.yml' "root/$ERD_DIR"/*.md 2>/dev/null \
            || true; } | xargs -r rm -f --
          cp erd/*.md "root/$ERD_DIR/"
          ERD_CHANGES=$(git -C root status --porcelain --untracked-files=all -- "$ERD_DIR")
          echo "ERD pages changed vs master: $(grep -c . <<<"$ERD_CHANGES" || true)"
          if [ "$OLD_FP" = "$NEW_FP" ] && [ -z "$ERD_CHANGES" ] && [ "$PUBLISH" != "true" ]; then
            echo "- structure and ERD unchanged since master (\`${NEW_FP:0:12}\`): no PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp reference.md "root/$REF_PATH"
          cd root
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$PR_BRANCH"
          git add -A -- "$REF_PATH" "$ERD_DIR"
          git commit -q -m "docs: regenerate db-schema-reference.md and the ERD pages from the live dump" \
            -m "Generated by AA-CIS-Infra DB Schema Dump ($REASON): $RUN_URL"
          git push -q --force origin "$PR_BRANCH"
          {
            echo "Generated by the AA-CIS-Infra **DB Schema Dump** workflow ($REASON): $RUN_URL"
            echo
            jq -r '"- Latest migration per owner: CIS **\(.migrations_latest_per_owner.cis)**, TripPlanner **\(.migrations_latest_per_owner.tripplanner)**, Booking **\(.migrations_latest_per_owner.booking)**",
                   "- \(.counts.schemas) schemas, \(.counts.relations) tables/views, \(.counts.indexes) indexes, \(.counts.policies) RLS policies, \(.counts.functions) functions"' ../schema.json
            echo "- Structural fingerprint: \`${OLD_FP:-none}\` on master -> \`$NEW_FP\`"
            if [ -n "$ERD_CHANGES" ]; then
              echo "- ERD pages changed (\`$ERD_DIR/\`, Mermaid; a new or dropped FK is a relationship line):"
              sed -E 's/^ *[^ ]+ +/  - `/; s/$/`/' <<<"$ERD_CHANGES"
            else
              echo "- ERD pages: unchanged"
            fi
            echo
            echo "Review the diff for objects no migration explains (DDL outside DB Migrate, standards MIG-5), then merge by hand."
            echo "Do not push to \`$PR_BRANCH\`: every run force-pushes it from master. This PR is updated in place until merged."
          } > ../pr-body.md
          PR=$(gh pr list --repo "$ROOT_REPO" --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$ROOT_REPO" --body-file ../pr-body.md
            echo "- updated root PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh pr create --repo "$ROOT_REPO" --base "$ROOT_BRANCH" --head "$PR_BRANCH" \
              --title "docs: regenerate db-schema-reference.md and ERD (live dump)" --body-file ../pr-body.md)
            echo "- opened root PR $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      # AA-894 scope 3: hand-written design ERDs (root docs/architecture/erd/design/<schema>.md, read from master, or from
      # the dispatch input design_ref) vs
      # this dump's erd.json. A report in the step summary: tables, primary keys and FK edges that differ. It fails
      # only for a live schema whose design page says enforce=true; a schema with no relations yet ("not live yet",
      # crm today) passes. Runs after the root PR step so a drift never holds back the regenerated reference.
      - name: Design ERD drift (report)
        if: always() && steps.root.outcome == 'success' && steps.render.outcome == 'success'
        env:
          DESIGN_REF: ${{ inputs.design_ref }}
        run: |
          DESIGN_DIR="root/$ERD_DIR/design"
          if [ -n "${DESIGN_REF:-}" ]; then
            # Only the design pages come from that ref; the reference and the generated pages were published from master.
            case "$DESIGN_REF" in *[!A-Za-z0-9._/-]*) echo "::error::design_ref has unexpected characters"; exit 2;; esac
            git -C root fetch --depth 1 origin "$DESIGN_REF"
            rm -rf "$DESIGN_DIR"
            git -C root checkout FETCH_HEAD -- "$ERD_DIR/design"
            echo "- design ERD pages read from \`$DESIGN_REF\` (dispatch input), not master" >> "$GITHUB_STEP_SUMMARY"
          fi
          if ! ls "$DESIGN_DIR"/*.md >/dev/null 2>&1; then
            echo "- design ERD drift: no design pages under \`$ERD_DIR/design/\` on master" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 db/check_erd_drift.py erd.json "$DESIGN_DIR" --summary "$GITHUB_STEP_SUMMARY"

      - name: Deregister the migrator revision
        if: always() && steps.td.outputs.arn != ''
        run: bash .github/scripts/migrator-task.sh deregister "${{ steps.td.outputs.arn }}"

      - name: Remove the dump script from S3
        if: always() && steps.task.outputs.prefix != ''
        run: aws s3 rm "s3://$BUCKET/${{ steps.task.outputs.prefix }}/schema_dump.py" --only-show-errors
