name: DB Migrate (shared RDS)
# Applies ONE reviewed migration from db/migrations/<owner>/ to the shared acc2 RDS.
# RDS is VPC-private, so the SQL runs in a one-off ECS Fargate task started from the CIS api task
# definition (same subnets/SG as the service), with the task's own DATABASE_URL secret. The
# runner script and the SQL reach the task through short-lived presigned S3 URLs; the task's exit
# code is the job result and its log is printed here.
#
# Flow: migration PR merged to main (human-approved) → run this with mode=check → mode=apply.
# Re-running apply is a no-op once the version is in shared.schema_versions.
#
# Safety (AA-807 N5, db/run_migration.py): every session runs with lock_timeout 5s,
# statement_timeout 15min, application_name db-migrate. Header directives in the file's leading
# comment block: `-- migrate: lock_timeout=…` / `statement_timeout=…` (overrides),
# `-- migrate: no-transaction` (statements one by one, e.g. CREATE INDEX CONCURRENTLY) and
# `-- migrate: destructive` (this workflow takes a manual RDS snapshot before apply). The same lint
# runs here before any AWS call and again in the task.
# Idle check (AA-751, ADR 0003a decision 5): the task reports every owner job table (`<schema>.job`)
# and open `shared.rerun_wave` rows on check and apply; apply re-checks 3 x 20 s and then refuses
# (exit 7) while one has a queued/running row of a non-exempt kind or a wave is open. The input
# override_busy_jobs (a reason, Nghiệp only) lets one apply proceed anyway, and is logged.
# After a successful apply, the DB Schema Dump workflow is dispatched (root reference PR, AA-807 N1).
# Owners (X1, db/owners.yaml): dirs cis/ (key NNN), tripplanner/ (tp-NNN), booking/ (bk-NNN) and the
# Infra-native roles/ (rl-NNN: role bootstrap, extensions, undo files). Before each file the task reads
# the live owner of the dir's anchor schema and runs the file as that role (SET LOCAL ROLE inside the
# file's transaction, then an ownership post-check before COMMIT); while the login role owns the
# anchor schema (today, every dir) nothing changes. roles/ files run only as the RDS master. The step
# summary shows `ran as: <role>`. Exit 8 = role refused, 9 = ownership post-check failed (rolled back).
on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Path under db/migrations/, e.g. cis/215_publish_log_idempotency.sql, tripplanner/007_register_versions.sql or roles/001_x1_owner_roles.sql"
        required: true
        type: string
      environment:
        description: "Target database (db/owners.yaml environments; only dev exists)"
        required: true
        type: choice
        options: [dev]
        default: dev
      mode:
        description: "check = report only; apply = run the file"
        required: true
        type: choice
        options: [check, apply]
        default: check
      override_busy_jobs:
        description: "Nghiệp only: reason to apply although a job table is busy or a rerun wave is open (empty = refuse when busy)"
        required: false
        type: string
        default: ""

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: write     # dispatch db-schema-dump.yml after an apply

jobs:
  migrate:
    name: Migrate (${{ inputs.environment }} ${{ inputs.mode }} ${{ inputs.migration }})
    runs-on: ubuntu-latest
    environment: prod
    if: github.ref == 'refs/heads/main'
    env:
      AWS_REGION: us-west-1
      CLUSTER: aa-cis-dev-cluster
      SERVICE: aa-cis-dev-api
      BUCKET: aa-cis-bronze-005097885195
      LOG_GROUP: /ecs/aa-cis-dev
      DB_INSTANCE: aa-cis-dev-db
      MIGRATION: ${{ inputs.migration }}
      MODE: ${{ inputs.mode }}
      ENVIRONMENT: ${{ inputs.environment }}
      OVERRIDE_BUSY_JOBS: ${{ inputs.override_busy_jobs }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate input
        id: file
        run: |
          # The resources below (cluster, service, bucket, instance) are the dev ones; a second
          # environment needs its own values before it is added to the choice list and owners.yaml.
          if [ "$ENVIRONMENT" != "dev" ]; then
            echo "::error::environment must be dev (db/owners.yaml environments)"; exit 1
          fi
          if ! [[ "$MIGRATION" =~ ^(cis|tripplanner|booking|roles)/([0-9]{3})_[a-z0-9_]+\.sql$ ]]; then
            echo "::error::migration must look like <cis|tripplanner|booking|roles>/215_name.sql"; exit 1
          fi
          test -f "db/migrations/$MIGRATION" || { echo "::error::db/migrations/$MIGRATION not found on main"; exit 1; }
          # shared.schema_versions key per owner (AA-684, docs/database/schema-ownership.md rule 4):
          # CIS keeps plain numbers; other owners are prefixed so their 007 cannot collide with CIS 007.
          # roles/ = Infra-native role bootstrap (X1, db/owners.yaml), key rl-NNN.
          case "${BASH_REMATCH[1]}" in
            cis) PREFIX="" ;; tripplanner) PREFIX="tp-" ;; booking) PREFIX="bk-" ;; roles) PREFIX="rl-" ;;
          esac
          echo "version=${PREFIX}${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "db/migrations/$MIGRATION" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "### $MODE \`$MIGRATION\` ($ENVIRONMENT)" >> "$GITHUB_STEP_SUMMARY"
          echo "- environment: $ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
          # Trimmed the same way the runner .strip()s MIGRATION_IDLE_OVERRIDE, so the summary and the
          # task agree on whether an override is present. A value of only spaces is rejected.
          OVR="${OVERRIDE_BUSY_JOBS#"${OVERRIDE_BUSY_JOBS%%[![:space:]]*}"}"
          OVR="${OVR%"${OVR##*[![:space:]]}"}"
          if [ -n "$OVERRIDE_BUSY_JOBS" ] && [ -z "$OVR" ]; then
            echo "::error::override_busy_jobs is blank: leave it empty, or give a reason"; exit 1
          fi
          if [ -n "$OVR" ]; then
            if [ "${#OVR}" -gt 200 ] || [[ "$OVR" == *$'\n'* ]]; then
              echo "::error::override_busy_jobs must be one line of at most 200 characters"; exit 1
            fi
            echo "::warning::idle check override requested: $OVR"
            echo "- **idle check override:** $OVR" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Header directives + lint (same code the task runs). A lint error stops here.
          set +e
          INSPECT=$(python3 db/run_migration.py --inspect "db/migrations/$MIGRATION"); LINT=$?
          set -e
          jq -r '.warnings[] | "::warning file=db/migrations/'"$MIGRATION"'::" + .' <<<"$INSPECT"
          jq -r '.errors[] | "::error file=db/migrations/'"$MIGRATION"'::" + .' <<<"$INSPECT"
          [ "$LINT" = "0" ] || exit 1
          echo "destructive=$(jq -r '.destructive' <<<"$INSPECT")" >> "$GITHUB_OUTPUT"
          jq -r '"- transaction: \(if .no_transaction then "no (statement by statement)" else "yes" end), destructive: \(.destructive), lock_timeout \(.settings.lock_timeout), statement_timeout \(.settings.statement_timeout)"' <<<"$INSPECT" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # MIG-12: the only undo for a destructive file that does not roll back all three apps. Taken on
      # every destructive apply dispatch (also when the version turns out to be applied already).
      # Delete the snapshot by hand once the contract is confirmed (>= 14 days).
      - name: Snapshot RDS before a destructive migration
        id: snapshot
        if: steps.file.outputs.destructive == 'true' && inputs.mode == 'apply'
        env:
          VERSION: ${{ steps.file.outputs.version }}
        run: |
          # run_attempt too: "Re-run jobs" keeps the run id, and a reused id fails create-db-snapshot.
          SNAP="db-migrate-${VERSION}-${{ github.run_id }}-${{ github.run_attempt }}"
          aws rds create-db-snapshot --db-instance-identifier "$DB_INSTANCE" --db-snapshot-identifier "$SNAP" \
            --tags Key=purpose,Value=db-migrate-destructive Key=migration,Value="$MIGRATION" Key=run,Value="${{ github.run_id }}" \
            --query 'DBSnapshot.Status' --output text
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          echo "id=$SNAP" >> "$GITHUB_OUTPUT"
          echo "- snapshot \`$SNAP\` available (delete by hand after the contract is confirmed)" >> "$GITHUB_STEP_SUMMARY"

      # Presigned URLs (15 min) are created and used in this one step — a masked value in a
      # step output can be dropped by Actions, so they are never passed between steps.
      - name: Upload runner + SQL, run one-off ECS task
        id: task
        env:
          VERSION: ${{ steps.file.outputs.version }}
          SHA256: ${{ steps.file.outputs.sha256 }}
          SNAPSHOT: ${{ steps.snapshot.outputs.id }}
        run: |
          PREFIX="db-migrate/${{ github.run_id }}"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          aws s3 cp db/run_migration.py "s3://$BUCKET/$PREFIX/run_migration.py" --only-show-errors
          aws s3 cp "db/migrations/$MIGRATION" "s3://$BUCKET/$PREFIX/migration.sql" --only-show-errors
          RUNNER_URL=$(aws s3 presign "s3://$BUCKET/$PREFIX/run_migration.py" --expires-in 900)
          SQL_URL=$(aws s3 presign "s3://$BUCKET/$PREFIX/migration.sql" --expires-in 900)
          echo "::add-mask::$RUNNER_URL"
          echo "::add-mask::$SQL_URL"

          SVC=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --output json)
          TASK_DEF=$(jq -r '.services[0].taskDefinition' <<<"$SVC")
          NET=$(jq -c '.services[0].networkConfiguration' <<<"$SVC")
          echo "task definition: $TASK_DEF"
          OVERRIDES=$(jq -nc \
            --arg runner "$RUNNER_URL" --arg sql "$SQL_URL" --arg file "$MIGRATION" \
            --arg version "$VERSION" --arg sha "$SHA256" --arg mode "$MODE" --arg snap "$SNAPSHOT" \
            --arg override "$OVERRIDE_BUSY_JOBS" \
            '{containerOverrides: [{name: "api",
              command: ["python3", "-c", "import os,urllib.request;exec(urllib.request.urlopen(os.environ[\"RUNNER_URL\"],timeout=30).read())"],
              environment: [
                {name: "RUNNER_URL", value: $runner}, {name: "MIGRATION_URL", value: $sql},
                {name: "MIGRATION_FILE", value: $file}, {name: "MIGRATION_VERSION", value: $version},
                {name: "MIGRATION_SHA256", value: $sha}, {name: "MIGRATION_MODE", value: $mode},
                {name: "MIGRATION_SNAPSHOT", value: $snap},
                {name: "MIGRATION_IDLE_OVERRIDE", value: $override},
                {name: "JOB_WORKER_IN_API", value: "false"}]}]}')
          TASK_ARN=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TASK_DEF" \
            --launch-type FARGATE --network-configuration "$NET" --overrides "$OVERRIDES" \
            --started-by "gh-db-migrate-${{ github.run_id }}" \
            --query 'tasks[0].taskArn' --output text)
          [ -n "$TASK_ARN" ] && [ "$TASK_ARN" != "None" ] || { echo "::error::run-task returned no task"; exit 1; }
          echo "task: $TASK_ARN"
          echo "arn=$TASK_ARN" >> "$GITHUB_OUTPUT"
          # The waiter gives up after 10 min, statement_timeout is 15 min: retry it (30 min total).
          for i in 1 2 3; do aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN" && break; done

      - name: Task log + result
        if: always() && steps.task.outputs.arn != ''
        env:
          TASK_ARN: ${{ steps.task.outputs.arn }}
        run: |
          TASK_ID="${TASK_ARN##*/}"
          aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "api/api/$TASK_ID" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' | tee task.log || true
          grep '^MIGRATE' task.log >> "$GITHUB_STEP_SUMMARY" || true
          DESC=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --output json)
          EXIT=$(jq -r '.tasks[0].containers[] | select(.name=="api") | .exitCode' <<<"$DESC")
          echo "exit code: $EXIT  stopped: $(jq -r '.tasks[0].stoppedReason' <<<"$DESC")"
          if [ "$EXIT" = "7" ]; then
            echo "::error::apply refused: a job table is busy or a rerun wave is open (see the MIGRATE busy lines). Wait until idle, or re-dispatch with override_busy_jobs=<reason> (Nghiệp only)"
            exit 1
          fi
          if [ "$EXIT" = "8" ]; then
            echo "::error::role refused (see the MIGRATE ERROR: role line): roles/ runs only as the master, the login role must be a member of the anchor schema's live owner, and a switched file must be one BEGIN … COMMIT block"
            exit 1
          fi
          if [ "$EXIT" = "9" ]; then
            echo "::error::ownership post-check failed: the file created objects owned by the login role (see the MIGRATE ERROR line); a transactional file was rolled back"
            exit 1
          fi
          [ "$EXIT" = "0" ] || { echo "::error::migration task exited with $EXIT"; exit 1; }

      # The apply already succeeded: a failed dispatch only warns (the nightly dump catches up).
      - name: Regenerate the schema reference (DB Schema Dump)
        if: success() && inputs.mode == 'apply'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run db-schema-dump.yml --repo "${{ github.repository }}" --ref main \
            -f reason="after DB Migrate apply of $MIGRATION (run ${{ github.run_id }})"
          echo "- dispatched DB Schema Dump (root reference PR if the structure changed)" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove S3 objects
        if: always() && steps.task.outputs.prefix != ''
        run: aws s3 rm "s3://$BUCKET/${{ steps.task.outputs.prefix }}/" --recursive --only-show-errors
