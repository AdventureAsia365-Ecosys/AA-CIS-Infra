name: Docs Gen (generated infra docs)
# AA-893: regenerates the root repo's docs/generated/ pages from the Terraform state of accounts/aa365:
#   alarms.md     OPS-07          every CloudWatch alarm + SNS-notifying EventBridge rule, with runbook links
#   network.md    ARCH-02-tables  VPC, subnets, routes, NAT, security groups, load balancers, API Gateway, DNS
#   inventory.md  ARCH-03         resources per App tag + the root Terraform outputs
#   iam-roles.md  ARCH-04-tables  IAM roles: trust, boundary, managed + inline policies
#   env-config.md APP-03          env var NAMES of every ECS service, Lambda function and Vercel project
#                                 (AA-894 scope 5, tools/docs/gen_env_config.py; see step "Env config register")
#
# 1. terraform init + `terraform show -json` with the READ-ONLY plan role (aa-cis-infra-tf-plan, which
#    trusts this repo's `ref:refs/heads/main` subject since AA-893). Nothing is planned, locked or applied.
#    The state JSON holds secret values in clear text: it stays in RUNNER_TEMP (umask 077), is never
#    printed or uploaded, and is deleted right after rendering. tools/docs/gen_docs.py reads an explicit
#    list of attributes and skips sensitive outputs.
# 2. Each runbook link must be a file under the root repo's docs/ (checked against the root checkout).
# 3. A page is published when its content fingerprint differs from root master, or when the copy on
#    master is older than 30 days (keeps last_reviewed fresh), or with publish=true. The pages are pushed
#    to the root branch bot/generated-infra-docs and a PR is opened or updated (merged by hand, root rule).
#    A broken or missing runbook link fails this run AFTER the PR is updated, so the bad row is visible.
#
# Env config register (AA-894): read live with the same read-only role (ReadOnlyAccess: ecs:Describe*/List*,
#    lambda:ListFunctions, secretsmanager:ListSecrets metadata) through the runner's preinstalled AWS CLI v2:
#    every call projects names with a JMESPath --query (Lambda: keys() of the environment), so a value never
#    leaves the CLI process and is written nowhere. No pip install in this job: it holds the plan role's
#    credentials and a root repo App token, and only stdlib Python runs next to them. Vercel names come from the API when the repo secret
#    VERCEL_TOKEN is set (team: repo variable VERCEL_TEAM_ID), otherwise from the checked-in snapshot
#    tools/docs/env_config_vercel.json (refresh: gen_env_config.py vercel-snapshot --cli). A failure there
#    does not hold back the Terraform pages: the run turns red at the end instead.
# Public repos (AA-981, S248 d15): every page goes through tools/docs/aws_mask.py (gen_docs.page): account ids become
#    labels ({acc2}), ARNs lose partition + account (and the Secrets Manager suffix), EC2/VPC ids become <prefix>-{masked};
#    a page that still holds one is refused. The label table is env AWS_ACCOUNT_ALIASES ("acc1=<id>,acc2=<id>,..."):
#    the optional repo SECRET AWS_ACCOUNT_ALIASES (a secret, not a variable: a variable is printed in this public
#    repo's logs) plus acc2 read from sts at run time, both ::add-mask::ed. Without the secret only acc2 is
#    named; any other id renders as {aws-account}.
# Triggers: nightly, manual, and Terraform Apply (its separate docs-gen-dispatch job, the only job there
# with `actions: write`) after every apply that changed something.
# Root repo access (AA-901, root ADR 0011): short-lived installation tokens of the GitHub App aa-ecosys-ci-bot,
# scoped to AdventureAsia365-Ecosys/AA-Ecosys only and revoked when the job ends. Two tokens, least privilege:
#   - a Contents READ token for the root checkout (persist-credentials: false), minted before the AWS steps
#     because the render step checks runbook links against that checkout;
#   - a Contents + Pull requests WRITE token minted right before the final push / gh step, after every AWS and
#     Terraform step, and used only there; no other step can read it from disk.
# Secrets and variables (repo level): AWS_ROLE_ARN (the plan role, as in terraform-plan.yml; this job has no
# environment, so the prod environment's apply-role value does not apply), TF_STATE_BUCKET, the variable
# AA_CI_BOT_APP_ID and the secret AA_CI_BOT_PRIVATE_KEY (repo level: this private repo on GitHub Free has no
# environment branch rule, so the job's main-only guard is what keeps the key off other refs).
# Cost: $0 AWS (state read from S3, a few GET requests); GitHub Actions about 1 minute a night.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run (shown in the root PR); Terraform Apply sets it after an apply"
        required: false
        type: string
        default: manual
      publish:
        description: "Open/update the root PR even if no page changed"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * *"   # nightly, 04:17 UTC (after DB Schema Dump at 03:43)

concurrency:
  group: docs-gen
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  render:
    name: Render generated infra docs
    runs-on: ubuntu-latest
    # No environment: the OIDC sub is `ref:refs/heads/main`, trusted only by the read-only plan role.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    env:
      AWS_REGION: us-west-1
      ROOT_REPO: AdventureAsia365-Ecosys/AA-Ecosys
      ROOT_BRANCH: master
      PR_BRANCH: bot/generated-infra-docs
      GEN_PATH: docs/generated
      REASON: ${{ github.event_name == 'schedule' && 'nightly' || inputs.reason || 'manual' }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && 'true' || 'false' }}
      HAS_CI_BOT_APP: ${{ vars.AA_CI_BOT_APP_ID != '' && secrets.AA_CI_BOT_PRIVATE_KEY != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # no later git operation on this repo needs the token

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit tests (generator)
        run: python -m unittest discover -s tools/docs/tests

      # AA-901: read-only App token for the root checkout (the job runs on main only, see `if:` above).
      - name: Mint the aa-ecosys-ci-bot token (root repo, contents read)
        id: root-read-token
        if: env.HAS_CI_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: AA-Ecosys
          permission-contents: read

      - name: Check out the root repo
        if: env.HAS_CI_BOT_APP == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ROOT_REPO }}
          ref: ${{ env.ROOT_BRANCH }}
          token: ${{ steps.root-read-token.outputs.token }}
          path: root
          fetch-depth: 1
          # No token in root/.git/config while terraform init / show run provider binaries; only the final
          # push step gets a (separate, write) token, passed in the push URL and never stored.
          persist-credentials: false

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      # Fail closed if the repo-level secret ever names a role with write rights.
      - name: Verify the role is the read-only plan role
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-cis-infra-tf-plan/*) echo "role: aa-cis-infra-tf-plan" ;;
            *) echo "::error::docs-gen must run with the read-only role aa-cis-infra-tf-plan (got another role)"; exit 1 ;;
          esac

      # AA-981: label table for aws_mask (never echoed: every id is masked in the log before it is used).
      - name: Account alias table for masking
        env:
          ALIASES: ${{ secrets.AWS_ACCOUNT_ALIASES }}
        run: |
          ACC=$(aws sts get-caller-identity --query Account --output text)
          echo "::add-mask::$ACC"
          ALIASES=$(printf '%s' "$ALIASES" | tr -s '[:space:],' ',' | sed 's/^,//; s/,$//')
          for entry in ${ALIASES//,/ }; do echo "::add-mask::${entry#*=}"; done
          case ",$ALIASES," in
            *"=$ACC,"*) ;;
            *) ALIASES="${ALIASES:+$ALIASES,}acc2=$ACC" ;;
          esac
          echo "::add-mask::$ALIASES"
          echo "AWS_ACCOUNT_ALIASES=$ALIASES" >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false   # clean JSON on stdout

      - name: Terraform Init (read-only)
        working-directory: accounts/aa365
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Read the state, render the pages
        run: |
          umask 077
          STATE="$RUNNER_TEMP/state.json"
          trap 'rm -f "$STATE"' EXIT
          terraform -chdir=accounts/aa365 show -json > "$STATE"
          ROOT_ARGS=()
          if [ -d root/docs ]; then ROOT_ARGS=(--root-dir root); fi
          python3 tools/docs/gen_docs.py render --tf-json "$STATE" --out-dir generated "${ROOT_ARGS[@]}" \
            --source "AA-CIS-Infra Docs Gen ($REASON), $RUN_URL" --sha "$GITHUB_SHA" \
            --problems-file problems.txt
          {
            echo "### Docs Gen ($REASON)"
            for f in generated/*.md; do echo "- \`$(basename "$f")\`: $(grep -c '^| ' "$f") table rows"; done
            if [ -s problems.txt ]; then echo "- **runbook problems:**"; sed 's/^/  - /' problems.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Env config register (names only)
        id: envcfg
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          umask 077
          GEN=tools/docs/gen_env_config.py
          python3 "$GEN" collect-aws --cluster aa-cis-dev-cluster --region "$AWS_REGION" --out "$RUNNER_TEMP/envcfg-aws.json"
          VERCEL_JSON=tools/docs/env_config_vercel.json
          if [ -n "$VERCEL_TOKEN" ]; then
            python3 "$GEN" vercel-snapshot --api --out "$RUNNER_TEMP/envcfg-vercel.json"
            VERCEL_JSON="$RUNNER_TEMP/envcfg-vercel.json"
          fi
          python3 "$GEN" render --aws "$RUNNER_TEMP/envcfg-aws.json" --vercel "$VERCEL_JSON" --out-dir generated \
            --source "AA-CIS-Infra Docs Gen ($REASON), $RUN_URL" --sha "$GITHUB_SHA"
          echo "- \`env-config.md\`: $(grep -c '^| ' generated/env-config.md) table rows (Vercel: $([ -n "$VERCEL_TOKEN" ] && echo live API || echo checked-in snapshot))" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the rendered pages as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-gen-${{ github.run_id }}
          path: generated/
          retention-days: 14

      # AA-901: the write token is minted only here, after every AWS / Terraform step.
      - name: Mint the aa-ecosys-ci-bot token (root repo, contents + pull requests write)
        id: root-write-token
        if: env.HAS_CI_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: AA-Ecosys
          permission-contents: write
          permission-pull-requests: write

      - name: Open or update the root PR when a page changed
        env:
          GH_TOKEN: ${{ steps.root-write-token.outputs.token }}
        run: |
          if [ "$HAS_CI_BOT_APP" != "true" ]; then
            echo "::error::the aa-ecosys-ci-bot App is not configured (repo variable AA_CI_BOT_APP_ID and/or secret AA_CI_BOT_PRIVATE_KEY missing): the pages are in the artifact, but no root PR can be opened"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            PAGES=$(cd generated && ls *.md)
          else
            PAGES=$(python3 tools/docs/gen_docs.py changed --new generated --old "root/$GEN_PATH")
          fi
          if [ -z "$PAGES" ]; then
            echo "- no page changed since root master: no PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "root/$GEN_PATH"
          for p in $PAGES; do cp "generated/$p" "root/$GEN_PATH/$p"; done
          cd root
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$PR_BRANCH"
          git add "$GEN_PATH"
          git commit -q -m "docs: regenerate infra docs ($(echo $PAGES | tr '\n' ' '))" \
            -m "Generated by AA-CIS-Infra Docs Gen ($REASON): $RUN_URL" -m "Refs AA-893, AA-894"
          # The root checkout keeps no credentials (persist-credentials: false): authenticate this push
          # only, with the App write token in the URL (masked in logs, never written to .git/config).
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${ROOT_REPO}.git" "HEAD:refs/heads/$PR_BRANCH"
          {
            echo "Generated by the AA-CIS-Infra **Docs Gen** workflow ($REASON): $RUN_URL"
            echo
            echo "Pages updated: $(echo $PAGES | tr '\n' ' ')"
            echo
            echo "Source: the Terraform state of \`accounts/aa365\` (read-only plan role), rendered by \`tools/docs/gen_docs.py\`;"
            echo "\`env-config.md\`: live ECS task definitions, Lambda configurations and Vercel env names (names only), rendered by \`tools/docs/gen_env_config.py\`."
            echo "Review the diff for changes no Terraform PR explains, then merge by hand."
            echo "Do not push to \`$PR_BRANCH\`: every run force-pushes it from master. This PR is updated in place until merged."
            echo
            echo "Refs AA-893, AA-894"
          } > ../pr-body.md
          PR=$(gh pr list --repo "$ROOT_REPO" --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --repo "$ROOT_REPO" --body-file ../pr-body.md
            echo "- updated root PR #$PR" >> "$GITHUB_STEP_SUMMARY"
          else
            URL=$(gh pr create --repo "$ROOT_REPO" --base "$ROOT_BRANCH" --head "$PR_BRANCH" \
              --title "docs: regenerate infra docs (alarms, network, inventory, IAM, env config)" --body-file ../pr-body.md)
            echo "- opened root PR $URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on missing or broken runbook links
        if: always()
        run: |
          if [ -s problems.txt ]; then
            while IFS= read -r line; do echo "::error title=alarm runbook::$line"; done < problems.txt
            exit 1
          fi
          echo "every alarm links to an existing runbook in the root repo"

      - name: Fail when the env config register could not be rendered
        if: always() && steps.envcfg.outcome == 'failure'
        run: |
          echo "::error title=env-config::the env config register step failed (see its log); the other pages were still published"
          exit 1
