name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    # S271 (lessons guard G9): two PR plans of one root never race the S3 state lock ("Error acquiring the state
    # lock"): every plan of a root waits in that root's group; a pending job holds no lock and no runner. Not shared
    # with terraform-apply.yml: GitHub keeps one PENDING job per group and cancels the older one, so a PR plan could
    # cancel a dispatched apply. Plan versus apply (and the drift run, a local MFA plan) is covered by -lock-timeout
    # below instead. With three PR plans at once the middle pending one is cancelled: rerun it.
    # tools/terraform/tests/test_workflow_tf_locking.py checks both on every Terraform workflow.
    concurrency:
      group: tf-state-aa365-plan
      cancel-in-progress: false

    defaults:
      run:
        working-directory: accounts/aa365

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # S271 (lessons guard G13): every aws_iam_role trust of accounts/ and modules/, all principal kinds (AWS,
      # Federated SAML / OIDC, Service, `*`, NotPrincipal). Fails on a new trust to an outside account, a SAML or
      # non-allowlisted OIDC provider, a GitHub OIDC trust without a sub condition or a service outside
      # tools/terraform/iam_trust_allowlist.json, until it is reviewed and acknowledged there. Static, stdlib only, before
      # any credential; the summary table is masked (tools/docs/aws_mask.py). The live account (roles Terraform does not
      # create, such as Identity Center ones) is read by the same tool's `live` mode in an audit, not here.
      - name: IAM trust inventory (static)
        working-directory: ${{ github.workspace }}
        run: python3 -B tools/terraform/iam_trust_inventory.py static --summary "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=dev/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: terraform plan -lock-timeout=10m -out=tfplan

      # S271: tagging standard (root docs/architecture/tagging-standard.md, FIN-03). Fails this required check when a
      # taggable resource the plan creates or updates lacks a mandatory tag or holds a value outside
      # tools/terraform/tag_policy.json. terraform-bin is the real binary next to the setup-terraform wrapper (the wrapper
      # adds a "[command]..." line to stdout, which is not JSON). The plan JSON holds sensitive values in clear text: it
      # stays in RUNNER_TEMP, is never printed or uploaded, and is deleted right after the guard, like the apply's.
      - name: Tag guard
        run: |
          umask 077
          if ! command -v terraform-bin >/dev/null; then
            echo "terraform-bin not found (setup-terraform wrapper layout changed?)" >&2
            exit 1
          fi
          J="$RUNNER_TEMP/tfplan.json"
          trap 'rm -f "$J" tfplan' EXIT
          terraform-bin show -json tfplan > "$J"
          python3 -B "$GITHUB_WORKSPACE/tools/terraform/tag_guard.py" "$J" --summary "$GITHUB_STEP_SUMMARY"

  # AA-1004: the management account root (accounts/management/README.md §11). Runs only when the PR touches that
  # root, this workflow or the report tool. Not a required check (the ruleset names "Terraform Plan (dev)" only).
  #
  # Role aa-terraform-plan in the management account (accounts/management/cicd.tf: read only, trusts the immutable
  # `pull_request` subject of this repo). Its ARN is built from the repo secret MGMT_ACCOUNT_ID, the state bucket name
  # too (README §3 naming); the inputs come from the repo secret MGMT_TFVARS (the content of the git-ignored local
  # terraform.tfvars, without aws_profile). Secrets, not variables: GitHub masks secrets in this public repo's logs.
  #
  # The plan text of this root is never printed (it holds e-mail addresses and member account ids): Terraform writes
  # JSON into RUNNER_TEMP and tools/terraform/drift_report.py --mode plan writes only addresses and actions, masked, to
  # the job summary. Before the one-time local bootstrap (README §11) the secrets do not exist: the job then warns and
  # skips, so this very PR does not go red; once the repo variable MGMT_CI_LIVE is `true`, a missing secret fails.
  #
  # S271 (G9): the path filter is its own job so that the plan job below joins the management root's concurrency group
  # only when it really plans (a PR that does not touch the root skips the plan job instead of queueing in the group).
  management-paths:
    name: Management root changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      run: ${{ steps.paths.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A file, not a pipe: with pipefail, `grep -q` closing the pipe early could fail `git diff` (SIGPIPE).
          git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
          if grep -qE '^(accounts/management/|\.github/workflows/terraform-plan\.yml$|tools/terraform/(drift_report\.py|tag_guard\.py|tag_policy\.json)$)' \
              "$RUNNER_TEMP/changed.txt"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "accounts/management not touched: no management plan." >> "$GITHUB_STEP_SUMMARY"
          fi

  terraform-plan-management:
    name: Terraform Plan (management)
    needs: management-paths
    if: needs.management-paths.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # S271 (G9): same rule as the dev plan, one group per root.
    concurrency:
      group: tf-state-management-plan
      cancel-in-progress: false

    env:
      ROOT: accounts/management
      TF_IN_AUTOMATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check CI wiring
        id: wiring
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
          MGMT_TFVARS: ${{ secrets.MGMT_TFVARS }}
          MGMT_CI_LIVE: ${{ vars.MGMT_CI_LIVE }}
        run: |
          if [ -z "$MGMT_ACCOUNT_ID" ] || [ -z "$MGMT_TFVARS" ]; then
            # Repo variable MGMT_CI_LIVE=true (README §11.2, after the bootstrap): a missing secret is then an error.
            if [ "$MGMT_CI_LIVE" = "true" ]; then
              echo "::error::MGMT_CI_LIVE=true but secrets MGMT_ACCOUNT_ID / MGMT_TFVARS are missing (accounts/management/README.md §11)"
              exit 1
            fi
            echo "::warning title=Management plan skipped::secrets MGMT_ACCOUNT_ID / MGMT_TFVARS are not set (accounts/management/README.md §11)"
            echo "Management plan skipped: CI wiring not set up yet (README §11)." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # Masks every 12-digit number and e-mail address of the inputs, refuses an aws_profile (CI uses OIDC credentials
      # from the environment), and points `terraform plan` at the file through TF_CLI_ARGS_plan.
      - name: Write management inputs (masked)
        if: steps.wiring.outputs.ok == 'true'
        env:
          MGMT_TFVARS: ${{ secrets.MGMT_TFVARS }}
        run: |
          umask 077
          F="$RUNNER_TEMP/management.tfvars"
          printf '%s\n' "$MGMT_TFVARS" > "$F"
          for v in $(grep -oE '[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$F" | sort -u); do
            echo "::add-mask::$v"
          done
          if grep -qE '^[[:space:]]*aws_profile[[:space:]]*=' "$F"; then
            echo "::error::MGMT_TFVARS sets aws_profile; CI runs on OIDC credentials, remove that line from the secret"
            exit 1
          fi
          echo "TF_CLI_ARGS_plan=-var-file=$F" >> "$GITHUB_ENV"

      - name: Configure AWS credentials (OIDC, management plan role)
        if: steps.wiring.outputs.ok == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MGMT_ACCOUNT_ID }}:role/aa-terraform-plan
          aws-region: us-west-1
          role-duration-seconds: 3600

      - name: Verify the role is the management plan role
        if: steps.wiring.outputs.ok == 'true'
        run: |
          ARN=$(aws sts get-caller-identity --query Arn --output text)
          case "$ARN" in
            *:assumed-role/aa-terraform-plan/*) echo "role: aa-terraform-plan" ;;
            *) echo "::error::the management plan must run with the read-only role aa-terraform-plan"; exit 1 ;;
          esac

      - name: Setup Terraform
        if: steps.wiring.outputs.ok == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false

      - name: Terraform Init
        if: steps.wiring.outputs.ok == 'true'
        working-directory: accounts/management
        env:
          MGMT_ACCOUNT_ID: ${{ secrets.MGMT_ACCOUNT_ID }}
        run: |
          terraform init -input=false -lockfile=readonly \
            -backend-config="bucket=aa-tfstate-${MGMT_ACCOUNT_ID}-usw1" \
            -backend-config="key=management/terraform.tfstate" \
            -backend-config="region=us-west-1"

      - name: Terraform Validate
        if: steps.wiring.outputs.ok == 'true'
        working-directory: accounts/management
        run: terraform validate -no-color

      - name: Terraform Plan (summary only)
        if: steps.wiring.outputs.ok == 'true'
        run: |
          umask 077
          LOG="$RUNNER_TEMP/management-plan.jsonl"
          trap 'rm -f "$LOG"' EXIT
          set +e
          terraform -chdir="$ROOT" plan -input=false -lock-timeout=10m -detailed-exitcode -json -out="$RUNNER_TEMP/management.tfplan" > "$LOG"
          RC=$?
          set -e
          echo "terraform plan exit code: $RC"
          python3 -B tools/terraform/drift_report.py --mode plan --plan-log "$LOG" --exit-code "$RC" --root "$ROOT" \
            --summary "$GITHUB_STEP_SUMMARY"

      # S271: the same tag guard as the dev plan (tagging standard FIN-03). Prints only addresses (identity-store keys
      # redacted), keys and the offending tag values; the plan JSON stays in RUNNER_TEMP and is deleted.
      - name: Tag guard (management)
        if: steps.wiring.outputs.ok == 'true'
        run: |
          umask 077
          J="$RUNNER_TEMP/management-plan.json"
          trap 'rm -f "$J" "$RUNNER_TEMP/management.tfplan"' EXIT
          terraform -chdir="$ROOT" show -json "$RUNNER_TEMP/management.tfplan" > "$J"
          python3 -B tools/terraform/tag_guard.py "$J" --summary "$GITHUB_STEP_SUMMARY"
