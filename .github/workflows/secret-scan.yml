name: Secret Scan
# AA-841: fail a PR that adds a secret. gitleaks scans the lines the PR's commits add
# (base..head), with the gitleaks v8.30.1 default rules plus this repo's rules in .gitleaks.toml (DSN with an
# embedded password, plaintext password / API key in Terraform, credential-named key with a
# literal value in tfvars / .env / JSON / YAML). Known false positives: prefer a .gitleaks.toml
# allowlist (a class of values; it matches every commit, so it survives the squash merge). A commit
# fingerprint in .gitleaksignore does not survive the squash merge (see the header of that file).
#
# This workflow runs on pull_request_target, so GitHub always runs the base branch's copy of it: a PR cannot change or
# skip the check that judges it, and a change to this file takes effect only after its merge. The PR head is checked
# out as data (git objects for gitleaks); nothing from the PR is run. Besides the PR's commits it scans a squash
# preview: the PR merged into the current base as one commit (the PR's own tree on the merge base if the two
# conflict), i.e. what the squash merge writes on main, so a value split across commits is seen whole and a finding
# that only a PR-commit pin covers is reported before the merge.
# The rules and the baseline (.gitleaks.toml, .gitleaksignore) are read from the PR's BASE commit, so a PR cannot add
# a secret together with an ignore line or an allowlist entry and pass. A PR that changes either file, one of the two
# secret scan workflows, .github/CODEOWNERS or any .gitattributes (it can mark a file binary or move it to Git LFS),
# changes a workflow that grants checks or statuses write (it could post a check through the API; read with yq, and
# a workflow yq cannot read counts too), or adds a line with an inline `gitleaks:allow` comment (that hides the line
# from both jobs) fails until a reviewer adds the label `secret-scan-baseline-reviewed`; the scan then uses the PR's
# own copies. The label counts only on the run that adding it starts: any later event of the PR with the label on (a
# push, a (re)open, another label) removes it and fails, so the reviewer adds it again after the last push (the
# gitleaks job has `pull-requests: write` for that only). The check also fails when another workflow in the PR has a
# job named `gitleaks`: the required check is matched by its name.
#
# AA-981: the PR scan never sees what is already in history, and this repo is public (22/10/2026),
# so every old commit is readable. secret-scan-history.yml scans every commit of every branch and tag,
# plus the head of every pull request, nightly, on each push to main and on demand (and, on demand,
# the working tree). It is a separate workflow so that a manual run on a PR branch cannot leave a
# skipped `gitleaks` check on the PR head: a skipped check counts as passed for a required check.
#
# Both scans read every file as text (`* diff` in .git/info/attributes: git shows the lines of a file with a NUL byte
# or a binary / -diff attribute too), read a renamed file as a new file (`--no-renames`: a rename out of an
# allowlisted path shows all its lines), read merge commits as their remerge diff (`--diff-merges=remerge`,
# git >= 2.36; the image ships 2.49: what the merge adds beyond git's own automatic merge of its parents; a conflicted
# merge shows its resolution as added lines), and fail on a merge with three or more parents (gitleaks cannot read
# what an octopus merge adds) and when git itself fails (gitleaks logs the git error and still exits 0). No path is
# skipped: .gitleaks.toml has no path allowlist for images, fonts, documents or lock files (a file name says nothing
# about its content). The rules match bytes, so UTF-16 text (a BOM, or ASCII with every other byte NUL; Windows
# PowerShell 5.1 writes it by default) gets its own pass: each such blob is transcoded to UTF-8 with iconv and
# scanned as a file at its own path.
# What this check does not stop: it catches careless changes, not a hostile writer. Anyone with write access can add
# the label, and can push a branch whose own push workflow posts a `gitleaks` check run or commit status (GitHub
# Actions, the same app as this job) on any PR head; nothing inside a PR can prevent that. For the prod gate (first
# prod or first paying tenant): code-owner review for /.github/ and the two files, plus one of: a ruleset that
# requires this workflow to pass (required workflows), a push ruleset that limits who may change
# .github/workflows/**, or a required check from a GitHub App other than GitHub Actions (app id 15368).
#
# Values are always redacted in the log. A red result means the value is public already: GitHub keeps
# the PR head and the pushed commits even after a force-push or a deleted branch. Rotate it, even if
# the commit is gone from the branch.
# Run it locally: README.md, "Secret scan".
on:
  # pull_request_target, not pull_request: the job below always comes from the base branch (see the header). It never
  # runs code from the PR. Do not add another trigger: the job-name check below refuses this file then.
  pull_request_target:
    branches: [main]
    # labeled / unlabeled: rerun when `secret-scan-baseline-reviewed` is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Runs of one PR cancel each other (on pull_request_target github.ref is the base branch, so the group is the PR
# number). The label guard below does not depend on an earlier run having finished.
concurrency:
  group: secret-scan-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest).
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to remove a stale `secret-scan-baseline-reviewed` label (see the step below)
    steps:
      # pull_request_target: this job always comes from the base branch. The PR head is checked out as data only
      # (git objects for gitleaks); no script, action or config from the PR is run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0 # gitleaks scans base..head
          persist-credentials: false # no token in the checkout, which is mounted into the gitleaks container

      - name: Scan the commits of this PR
        env:
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }} # the label added or removed, on labeled / unlabeled
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }} # not passed to the gitleaks container
          BASELINE_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'secret-scan-baseline-reviewed') }}
        run: |
          set +e
          cfg="$RUNNER_TEMP/gitleaks-cfg"
          logs="$RUNNER_TEMP/gitleaks-logs"
          u16="$RUNNER_TEMP/gitleaks-utf16"
          mkdir -p "$cfg" "$logs" "$u16"
          label=secret-scan-baseline-reviewed
          guard=0
          # A git command that fails must fail the check: an empty list would pass a guard.
          die() { echo "::error title=gitleaks::${1} failed, so the PR cannot be judged. Rerun the job."; exit 1; }
          # Both commits must be in the checkout: on a bad revision gitleaks logs the git error and exits 0.
          for c in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${c}^{commit}" 2>/dev/null; then
              echo "::error title=gitleaks::Commit ${c} is not in the checkout, so the PR cannot be scanned. Rerun the job."
              exit 1
            fi
          done
          # gitleaks cannot read what a merge with three or more parents adds (remerge covers two parents only).
          octopus=$(git rev-list --min-parents=3 "${BASE_SHA}..${HEAD_SHA}") || die "git rev-list"
          if [ -n "$octopus" ]; then
            octopus=$(printf '%s\n' "$octopus" | xargs)
            echo "::error title=gitleaks::This PR has a merge with three or more parents (${octopus}), which the scan cannot read. Replace it with two-parent merges or a rebase."
            exit 1
          fi
          # The PR's merge with the base: what GitHub runs pull_request workflows from, and (below) what the squash
          # merge writes. On a conflict GitHub runs none: use the PR head here, and its own tree for the preview.
          mt=$(git merge-tree --write-tree "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)
          case $? in
            0) wtree=${mt%%$'\n'*}; clean=1 ;;
            1) wtree="$HEAD_SHA"; clean=0 ;;
            *) die "git merge-tree" ;;
          esac
          # The required check `gitleaks` is matched by name: a job called `gitleaks` in another workflow (or in this
          # file's copy with another trigger) would report a second check of that name. Only this job may carry it:
          # secret-scan.yml with pull_request_target as its only trigger. Read the workflows of the merge above with
          # yq (preinstalled on the runner; explode resolves anchors and aliases); a workflow it cannot read fails
          # the check. A name built by an expression counts unless its literal text before the first expression
          # already rules out "gitleaks".
          dup=""
          wfs=$(git ls-tree -r --name-only "$wtree" -- .github/workflows) || die "git ls-tree"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            y=$(git show "${wtree}:${f}") || die "git show"
            if ! jobs=$(printf '%s\n' "$y" | yq -r 'explode(.) | (.jobs // {}) | to_entries | .[] | [.key, ((.value.name // "") | tostring)] | @tsv' - 2>/dev/null); then
              dup="${dup}${f} (unreadable YAML) "; continue
            fi
            hit=$(printf '%s\n' "$jobs" | awk -F'\t' 'NF {
              id = tolower($1); n = tolower($2); gsub(/^[ \t]+|[ \t]+$/, "", n); p = index(n, "$" "{{")
              pre = p > 0 ? substr(n, 1, p - 1) : ""
              if (id == "gitleaks" || n == "gitleaks" || (p > 0 && (pre == "" || index("gitleaks", pre) == 1))) print $1 }' | xargs)
            [ -z "$hit" ] && continue
            on=$(printf '%s\n' "$y" | yq -r 'explode(.) | .on | ((select(tag == "!!str")), (select(tag == "!!seq") | .[]), (select(tag == "!!map") | keys | .[]))' - 2>/dev/null | xargs)
            if [ "$f" != .github/workflows/secret-scan.yml ] || [ "$on" != pull_request_target ]; then
              dup="${dup}${f} (job ${hit}; triggers: ${on:-none}) "
            fi
          done <<< "$(printf '%s\n' "$wfs" | grep -iE '\.ya?ml$')"
          if [ -n "$dup" ]; then
            echo "::error title=gitleaks::Only the pull_request_target job of secret-scan.yml may be named gitleaks (the required check). Rename or remove it in: ${dup}"
            exit 1
          fi
          # From here on, read every file as text: `* diff` makes git show a file's lines even when it has a NUL byte
          # or a .gitattributes `binary` / `-diff` (also on the base branch). The info file wins over every
          # .gitattributes.
          mkdir -p .git/info && printf '* diff\n' > .git/info/attributes
          # Files where the given commits add a line with an inline allow comment, which hides that line from both
          # jobs. Same patches as the scan below: each commit's diff, a renamed file as a new file, a merge commit as
          # its remerge diff (what the merge adds beyond git's automatic merge of its parents). Prints file names
          # only, never the lines. Fails when git fails (pipefail in the subshell).
          allow_files() (
            set -o pipefail
            git log -p -U0 --diff-merges=remerge --no-renames --no-color --no-ext-diff --format= "$@" | awk '
              /^diff --/ { hdr = 1; next }
              /^@@/ { hdr = 0; next }
              hdr && /^\+\+\+ / { f = substr($0, 7); next }
              !hdr && /^\+/ && index($0, "gitleaks:allow") { print f }' | sort -u | tr '\n' ' '
          )
          # Rules and baseline come from the base branch: a PR cannot loosen the scan that judges it. Also guarded:
          # both secret scan workflows, CODEOWNERS (it names the reviewers of these files) and every .gitattributes
          # (binary, -diff and Git LFS attributes take lines out of the diff that git log -p shows).
          touched=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- .gitleaks.toml .gitleaksignore .github/workflows/secret-scan.yml .github/workflows/secret-scan-history.yml .github/CODEOWNERS ':(glob)**/.gitattributes') || die "git diff"
          touched=$(printf '%s\n' "$touched" | sed '/^$/d' | tr '\n' ' ')
          # And a changed workflow that grants checks or statuses write (it could post a check run or a commit
          # status named gitleaks through the API), or one yq cannot read. Parsed with yq, not grepped: quoting,
          # escapes, folded scalars and aliases all decode to the value GitHub reads.
          changed=$(git diff --name-only --diff-filter=d "${BASE_SHA}...${HEAD_SHA}" -- .github/workflows) || die "git diff"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! grant=$(set -o pipefail; git show "${HEAD_SHA}:${f}" | yq -r 'explode(.) | [.permissions, ((.jobs // {}) | .[] | .permissions)] | .[] | select(. != null) | ((select(tag == "!!str")), (select(tag == "!!map") | to_entries | .[] | select(.key == "checks" or .key == "statuses") | .value))' - 2>/dev/null) \
              || printf '%s\n' "$grant" | grep -qixE 'write|write-all'; then
              case " $touched " in *" $f "*) ;; *) touched="${touched}${f} " ;; esac
            fi
          done <<< "$(printf '%s\n' "$changed" | grep -iE '\.ya?ml$')"
          allowed=$(allow_files "${BASE_SHA}..${HEAD_SHA}") || die "git log"
          what=""
          [ -n "$touched" ] && what="changes ${touched}"
          [ -n "$allowed" ] && what="${what:+${what}and }adds an inline gitleaks:allow in ${allowed}"
          # The label counts only on the run that adding it starts (event `labeled` for this label): the reviewer adds
          # it after reading the PR at its current head. Any other event with the label already on (a push, an open or
          # reopen, another label added or removed) removes it and fails, so it never carries over to commits the
          # reviewer has not seen. This holds whatever happened to earlier runs: runs of one PR cancel each other, and
          # an event payload can still list a label that an earlier run was about to remove.
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ] && { [ "$ACTION" != labeled ] || [ "$EVENT_LABEL" != "$label" ]; }; then
            BASELINE_REVIEWED=false
            why="this run was started by '${ACTION}${EVENT_LABEL:+ ${EVENT_LABEL}}', not by adding the label"
            if gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/${label}" --silent; then
              echo "::warning title=gitleaks baseline::Removed the label ${label}: ${why}. A reviewer reads the PR at its current head and adds it again."
            else
              echo "::error title=gitleaks baseline::${why}, and the label ${label} could not be removed (already removed?). A maintainer removes it if it is still on, reviews the PR at its current head, then adds it again."
            fi
          fi
          src="$BASE_SHA"
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ]; then
            echo "::notice title=gitleaks baseline::This PR ${what}and has the label ${label}: scanning with the PR's own copies."
            src="$HEAD_SHA"
          elif [ -n "$what" ]; then
            guard=1
            echo "::error title=gitleaks baseline::This PR ${what}(secret scan rules, baseline, workflows, workflow permissions, CODEOWNERS or .gitattributes). The scan below uses the base branch copies. After review, add the label ${label} to rescan with the PR's copies."
          fi
          # Read the two files as git objects (a symlink in the PR is its target's name, never followed).
          if ! git show "${src}:.gitleaks.toml" > "$cfg/.gitleaks.toml" 2>/dev/null; then
            echo "::error title=gitleaks::.gitleaks.toml does not exist at ${src}, so there are no rules to scan with."
            exit 1
          fi
          git show "${src}:.gitleaksignore" > "$cfg/.gitleaksignore" 2>/dev/null || : > "$cfg/.gitleaksignore"
          # gitleaks also loads <source>/.gitleaksignore on its own, on top of --gitleaks-ignore-path: put the
          # chosen copies in the checkout too (git mode reads commits, not these working-tree files). Remove the
          # PR's entries first, so that a symlink or a directory there cannot redirect the copy.
          rm -rf .gitleaks.toml .gitleaksignore
          cp "$cfg/.gitleaks.toml" "$cfg/.gitleaksignore" .
          scan() { # <log file> <log options>
            # Run as the runner user so git inside the container accepts the checkout's ownership.
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -v "$cfg:/cfg:ro" -w /repo "$GITLEAKS_IMAGE" \
              git /repo --log-opts="$2" \
              --config /cfg/.gitleaks.toml --gitleaks-ignore-path /cfg/.gitleaksignore \
              --redact --verbose --no-banner --exit-code 1 > "$1" 2>&1
          }
          echo "Scanning the commits of this PR: ${BASE_SHA}..${HEAD_SHA} (rules from ${src})"
          scan "$logs/commits.log" "--diff-merges=remerge --no-renames ${BASE_SHA}..${HEAD_SHA}"
          status=$?
          cat "$logs/commits.log"
          # Squash preview: what the squash merge writes on the base branch, as one commit: the PR's merge with the
          # base (the tree above) on the base commit; on a conflict, the PR's own tree on the merge base. Catches a
          # value split across commits (a key whose END line comes in a later commit), and a finding pinned by a PR
          # commit in .gitleaksignore, which does not cover the squash commit.
          if [ "$clean" = 1 ]; then
            pv="the PR merged into the base ${BASE_SHA}"
            sq=$(git -c user.name=gitleaks-ci -c user.email=gitleaks-ci@localhost commit-tree "$wtree" -p "$BASE_SHA" -m "squash preview of ${HEAD_SHA}") || die "git commit-tree"
          else
            mb=$(git merge-base "$BASE_SHA" "$HEAD_SHA") || die "git merge-base"
            pv="the PR tree on the merge base ${mb}; the PR conflicts with the base"
            sq=$(git -c user.name=gitleaks-ci -c user.email=gitleaks-ci@localhost commit-tree "${HEAD_SHA}^{tree}" -p "$mb" -m "squash preview of ${HEAD_SHA}") || die "git commit-tree"
          fi
          echo "Scanning the squash preview ${sq} (${pv})"
          scan "$logs/squash.log" "--no-renames -1 ${sq}"
          sqstatus=$?
          cat "$logs/squash.log"
          # UTF-16 text (Windows PowerShell 5.1 writes it by default) is invisible to the rules, which match bytes.
          # Every blob the PR's commits add (also one removed again) that starts with a UTF-16 BOM (FF FE / FE FF) or
          # is ASCII with every other byte NUL is transcoded to UTF-8 with iconv and scanned as a file at its own
          # path, <blob id>/<path> (gitleaks dir: path rules apply; inline allows are ignored there, the allow guard
          # above cannot see them in UTF-16). Python prints counts only, never content.
          cat > "$RUNNER_TEMP/utf16.py" <<'PY'
          import os, subprocess, sys
          out, n = sys.argv[1], 0
          cat = subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          for line in sys.stdin.buffer:  # git rev-list --objects: "<id> <path>"; commits and root trees have no path
              oid, _, path = line.rstrip(b"\n").partition(b" ")
              if not path:
                  continue
              cat.stdin.write(oid + b"\n"); cat.stdin.flush()
              hdr = cat.stdout.readline().split()
              if len(hdr) < 3:  # "<id> missing": the rest of a path with a newline in it
                  continue
              data = cat.stdout.read(int(hdr[2]) + 1)[:-1]
              if hdr[1] != b"blob":
                  continue
              h = data[:512]; pairs = len(h) // 2
              le = sum(1 for i in range(pairs) if h[2 * i + 1] == 0 and 9 <= h[2 * i] < 127)
              be = sum(1 for i in range(pairs) if h[2 * i] == 0 and 9 <= h[2 * i + 1] < 127)
              if h[:2] in (b"\xff\xfe", b"\xfe\xff"):
                  enc = "UTF-16"
              elif pairs >= 4 and 4 * le >= 3 * pairs:
                  enc = "UTF-16LE"
              elif pairs >= 4 and 4 * be >= 3 * pairs:
                  enc = "UTF-16BE"
              else:
                  continue
              parts = [p for p in path.decode("utf-8", "replace").split("/") if p not in ("", ".", "..")]
              dst = os.path.join(out, oid.decode(), *parts)
              os.makedirs(os.path.dirname(dst), exist_ok=True)
              with open(dst, "wb") as f:
                  subprocess.run(["iconv", "-c", "-f", enc, "-t", "UTF-8"], input=data, stdout=f)
              n += 1
          cat.stdin.close()
          if cat.wait():
              sys.exit(1)
          print(n)
          PY
          n16=$(set -o pipefail; git rev-list --objects "${BASE_SHA}..${HEAD_SHA}" | python3 -I "$RUNNER_TEMP/utf16.py" "$u16") || die "The UTF-16 pass"
          u16status=0
          if [ "$n16" -gt 0 ]; then
            echo "Scanning ${n16} UTF-16 file(s) of this PR, transcoded to UTF-8"
            docker run --rm -u "$(id -u):$(id -g)" -v "$u16:/u16:ro" -v "$cfg:/cfg:ro" -w /u16 "$GITLEAKS_IMAGE" \
              dir . --config /cfg/.gitleaks.toml --gitleaks-ignore-path /cfg/.gitleaksignore --ignore-gitleaks-allow \
              --redact --verbose --no-banner --exit-code 1 > "$logs/utf16.log" 2>&1
            u16status=$?
            cat "$logs/utf16.log"
          fi
          # gitleaks logs a failed git command and still exits 0 with "no leaks found": treat that as a failure.
          gitfail=0
          if [ -z "$sq" ] || grep -qF -e 'stderr is not empty' -e '[git] fatal' "$logs/commits.log" "$logs/squash.log"; then
            gitfail=1
            echo "::error title=gitleaks::git failed inside the scan (see the log above), so the result is not valid."
          fi
          {
            echo '### Secret scan (gitleaks)'
            if [ "$gitfail" -ne 0 ]; then
              echo 'git failed inside the scan, so it proves nothing. Rerun the job; see the log for the git error.'
            elif [ "$status" -eq 0 ] && [ "$sqstatus" -eq 0 ] && [ "$u16status" -eq 0 ]; then
              echo "No secrets found (UTF-16 files scanned: ${n16})."
            else
              echo 'gitleaks reported findings (values redacted). A real value is public already: the branch was'
              echo 'pushed, and GitHub keeps the PR head and its commits after a force-push or a deleted branch. Rotate'
              echo 'it first, even if you force-push it away, then remove it from the PR commits (docs name secrets,'
              echo 'they never hold values). For a false positive, prefer a narrow allowlist entry in `.gitleaks.toml`:'
              echo 'a commit fingerprint in `.gitleaksignore` does not survive the squash merge (see that file), and the'
              echo 'squash preview below reports it. Either change needs the label `secret-scan-baseline-reviewed`.'
              echo 'Commits of the PR:'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Fingerprint):' "$logs/commits.log" || true
              echo '```'
              echo 'Squash preview (what the squash merge writes on the base branch; its commit id changes every run):'
              echo '```'
              grep -E '^(RuleID|File|Line|Fingerprint):' "$logs/squash.log" || true
              echo '```'
              echo 'UTF-16 files, transcoded (File is <blob id>/<path>; that fingerprint can be pinned):'
              echo '```'
              grep -E '^(RuleID|File|Line|Fingerprint):' "$logs/utf16.log" 2>/dev/null || true
              echo '```'
            fi
            if [ "$guard" -ne 0 ]; then
              echo "This PR ${what}(secret scan rules, baseline, workflows, workflow permissions, CODEOWNERS or"
              echo '.gitattributes). It needs the label `secret-scan-baseline-reviewed`, added by a reviewer who has'
              echo 'read the PR at its current head, after the last push (a later push, a (re)open or another label change'
              echo 'removes it again).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || [ "$sqstatus" -ne 0 ] || [ "$u16status" -ne 0 ]; then
            echo "::error title=gitleaks::A secret-like value was added in this PR. Rotate it if real, even after a force-push. See the job summary."
          fi
          [ "$gitfail" -ne 0 ] && exit 1
          [ "$guard" -ne 0 ] && exit 1
          [ "$status" -ne 0 ] && exit "$status"
          [ "$sqstatus" -ne 0 ] && exit "$sqstatus"
          exit "$u16status"
