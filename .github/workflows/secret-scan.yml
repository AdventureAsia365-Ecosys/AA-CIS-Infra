name: Secret Scan
# AA-841: fail a PR that adds a secret. gitleaks scans the lines the PR's commits add
# (base..head), with the default rules plus this repo's rules in .gitleaks.toml (DSN with an
# embedded password, plaintext password / API key in Terraform, credential-named key with a
# literal value in tfvars / .env / JSON / YAML). Known false positives: prefer a .gitleaks.toml
# allowlist (a class of values; it matches every commit, so it survives the squash merge). A commit
# fingerprint in .gitleaksignore does not survive the squash merge (see the header of that file).
#
# The PR scan reads .gitleaks.toml and .gitleaksignore from the PR's BASE commit, so a PR cannot
# add a secret together with an ignore line or an allowlist entry and pass. A PR that changes either
# file, one of the two secret scan workflows, .github/CODEOWNERS or any .gitattributes (it can mark a
# file binary or move it to Git LFS, out of the diff), or adds a line with an inline `gitleaks:allow`
# comment (that hides the line from both jobs), fails until a reviewer adds the label
# `secret-scan-baseline-reviewed`; the scan then uses the PR's own copies. The label counts only on
# the run that adding it starts: any later event of the PR with the label on (a push, a (re)open,
# another label) removes it and fails, so the reviewer adds it again after the last push (the gitleaks
# job has `pull-requests: write` for that only). The guarded files are in CODEOWNERS (/.github/).
#
# AA-981: the PR scan never sees what is already in history, and this repo is public (22/10/2026),
# so every old commit is readable. secret-scan-history.yml scans every commit of every branch and tag,
# plus the head of every pull request, nightly, on each push to main and on demand (and, on demand,
# the working tree). It is a separate workflow so that a manual run on a PR branch cannot leave a
# skipped `gitleaks` check on the PR head: a skipped check counts as passed for a required check.
#
# Both scans read every file as text (`* !diff` in .git/info/attributes overrides a binary or -diff
# attribute), read a renamed file as a new file (`--no-renames`: a rename out of an allowlisted path
# shows all its lines), read merge commits as their remerge diff (`--diff-merges=remerge`, git >= 2.36;
# the image ships 2.49: what the merge adds beyond git's own automatic merge of its parents; a
# conflicted merge shows its resolution as added lines), and fail on a merge with three or more parents
# (gitleaks cannot read what an octopus merge adds) and when git itself fails (gitleaks logs the git
# error and still exits 0).
# The guard is advisory while the default branch does not require code-owner review: a pull_request run
# uses the PR's own copy of this file, so a PR can change the check itself. A PR that edits this file
# needs the label too, which catches a careless edit, not a hostile one. Require code-owner review for
# /.github/ and the two files when the merge rule tightens (first prod or first paying tenant).
#
# Values are always redacted in the log. A red result means the value is public already: GitHub keeps
# the PR head and the pushed commits even after a force-push or a deleted branch. Rotate it, even if
# the commit is gone from the branch.
# Run it locally: README.md, "Secret scan".
on:
  pull_request:
    branches: [main]
    # labeled / unlabeled: rerun when `secret-scan-baseline-reviewed` is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Runs of one PR cancel each other. The label guard below does not depend on an earlier run having finished.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest).
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to remove a stale `secret-scan-baseline-reviewed` label (see the step below)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans base..head
          persist-credentials: false # the checkout is mounted into the gitleaks container

      - name: Scan the commits of this PR
        env:
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }} # the label added or removed, on labeled / unlabeled
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }} # not passed to the gitleaks container
          BASELINE_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'secret-scan-baseline-reviewed') }}
        run: |
          set +e
          cfg="$RUNNER_TEMP/gitleaks-cfg"
          mkdir -p "$cfg"
          label=secret-scan-baseline-reviewed
          guard=0
          # Both commits must be in the checkout: on a bad revision gitleaks logs the git error and exits 0.
          for c in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git cat-file -e "${c}^{commit}" 2>/dev/null; then
              echo "::error title=gitleaks::Commit ${c} is not in the checkout, so the PR cannot be scanned. Rerun the job."
              exit 1
            fi
          done
          # gitleaks cannot read what a merge with three or more parents adds (remerge covers two parents only).
          octopus=$(git rev-list --min-parents=3 "${BASE_SHA}..${HEAD_SHA}" | xargs)
          if [ -n "$octopus" ]; then
            echo "::error title=gitleaks::This PR has a merge with three or more parents (${octopus}), which the scan cannot read. Replace it with two-parent merges or a rebase."
            exit 1
          fi
          # Read every file as text: a .gitattributes `binary` or `-diff` (also on the base branch) would otherwise
          # hide its lines from git log -p, so from the scan and from the inline-allow check below. The info file
          # wins over every .gitattributes.
          mkdir -p .git/info && printf '* !diff\n' > .git/info/attributes
          # Files where the given commits add a line with an inline allow comment, which hides that line from both
          # jobs. Same patches as the scan below: each commit's diff, a renamed file as a new file, a merge commit as
          # its remerge diff (what the merge adds beyond git's automatic merge of its parents). Prints file names
          # only, never the lines.
          allow_files() {
            git log -p -U0 --diff-merges=remerge --no-renames --no-color --no-ext-diff --format= "$@" | awk '
              /^diff --/ { hdr = 1; next }
              /^@@/ { hdr = 0; next }
              hdr && /^\+\+\+ / { f = substr($0, 7); next }
              !hdr && /^\+/ && index($0, "gitleaks:allow") { print f }' | sort -u | tr '\n' ' '
          }
          # Rules and baseline come from the base branch: a PR cannot loosen the scan that judges it. Also guarded:
          # both secret scan workflows, CODEOWNERS (it names the reviewers of these files) and every .gitattributes
          # (binary, -diff and Git LFS attributes take lines out of the diff that git log -p shows).
          touched=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- .gitleaks.toml .gitleaksignore .github/workflows/secret-scan.yml .github/workflows/secret-scan-history.yml .github/CODEOWNERS ':(glob)**/.gitattributes' | tr '\n' ' ')
          allowed=$(allow_files "${BASE_SHA}..${HEAD_SHA}")
          what=""
          [ -n "$touched" ] && what="changes ${touched}"
          [ -n "$allowed" ] && what="${what:+${what}and }adds an inline gitleaks:allow in ${allowed}"
          # The label counts only on the run that adding it starts (event `labeled` for this label): the reviewer adds
          # it after reading the PR at its current head. Any other event with the label already on (a push, an open or
          # reopen, another label added or removed) removes it and fails, so it never carries over to commits the
          # reviewer has not seen. This holds whatever happened to earlier runs: runs of one PR cancel each other, and
          # an event payload can still list a label that an earlier run was about to remove.
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ] && { [ "$ACTION" != labeled ] || [ "$EVENT_LABEL" != "$label" ]; }; then
            BASELINE_REVIEWED=false
            why="this run was started by '${ACTION}${EVENT_LABEL:+ ${EVENT_LABEL}}', not by adding the label"
            if gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/${label}" --silent; then
              echo "::warning title=gitleaks baseline::Removed the label ${label}: ${why}. A reviewer reads the PR at its current head and adds it again."
            else
              echo "::error title=gitleaks baseline::${why}, and the label ${label} could not be removed (already removed, or a fork PR with a read-only token). A maintainer removes it if it is still on, reviews the PR at its current head, then adds it again."
            fi
          fi
          src="$BASE_SHA"
          if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ]; then
            echo "::notice title=gitleaks baseline::This PR ${what}and has the label ${label}: scanning with the PR's own copies."
            src="$HEAD_SHA"
          elif [ -n "$what" ]; then
            guard=1
            echo "::error title=gitleaks baseline::This PR ${what}(secret scan rules, baseline, workflows, CODEOWNERS or .gitattributes). The scan below uses the base branch copies. After review, add the label ${label} to rescan with the PR's copies."
          fi
          for f in .gitleaks.toml .gitleaksignore; do
            if ! git show "${src}:${f}" > "$cfg/$f" 2>/dev/null; then
              echo "::warning::${f} does not exist at ${src}; using the PR's copy (the PR that first adds it)."
              cp "$f" "$cfg/$f" 2>/dev/null || : > "$cfg/$f"
            fi
          done
          # gitleaks also loads <source>/.gitleaksignore on its own, on top of --gitleaks-ignore-path: put the
          # chosen copies in the checkout too (git mode reads commits, not these working-tree files).
          cp "$cfg/.gitleaks.toml" "$cfg/.gitleaksignore" .
          echo "Scanning the commits of this PR: ${BASE_SHA}..${HEAD_SHA} (rules from ${src})"
          # Run as the runner user so git inside the container accepts the checkout's ownership.
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -v "$cfg:/cfg:ro" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --log-opts="--diff-merges=remerge --no-renames ${BASE_SHA}..${HEAD_SHA}" \
            --config /cfg/.gitleaks.toml --gitleaks-ignore-path /cfg/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > scan.log 2>&1
          status=$?
          cat scan.log
          # gitleaks logs a failed git command and still exits 0 with "no leaks found": treat that as a failure.
          gitfail=0
          if grep -qF -e 'stderr is not empty' -e '[git] fatal' scan.log; then
            gitfail=1
            echo "::error title=gitleaks::git failed inside the scan (see the log above), so the result is not valid."
          fi
          {
            echo '### Secret scan (gitleaks)'
            if [ "$gitfail" -ne 0 ]; then
              echo 'git failed inside the scan, so it proves nothing. Rerun the job; see the log for the git error.'
            elif [ "$status" -eq 0 ]; then
              echo 'No secrets found.'
            else
              echo 'gitleaks reported findings (values redacted). A real value is public already: the branch was'
              echo 'pushed, and GitHub keeps the PR head and its commits after a force-push or a deleted branch. Rotate'
              echo 'it first, even if you force-push it away, then remove it from the PR commits (docs name secrets,'
              echo 'they never hold values). For a false positive, prefer a narrow allowlist entry in `.gitleaks.toml`:'
              echo 'a commit fingerprint in `.gitleaksignore` does not survive the squash merge (see that file). Either'
              echo 'change needs the label `secret-scan-baseline-reviewed` after review.'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Fingerprint):' scan.log || true
              echo '```'
            fi
            if [ "$guard" -ne 0 ]; then
              echo "This PR ${what}(secret scan rules, baseline, workflows, CODEOWNERS or .gitattributes). It needs"
              echo 'the label `secret-scan-baseline-reviewed`, added by a reviewer who has read the PR at its current'
              echo 'head, after the last push (a later push, a (re)open or another label change removes it again).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks::A secret-like value was added in this PR. Rotate it if real, even after a force-push. See the job summary."
          fi
          [ "$gitfail" -ne 0 ] && exit 1
          [ "$guard" -ne 0 ] && exit 1
          exit "$status"
