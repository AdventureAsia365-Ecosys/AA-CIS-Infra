name: Secret Scan
# AA-841: fail a PR that adds a secret. gitleaks scans the lines the PR's commits add
# (base..head), with the default rules plus this repo's rules in .gitleaks.toml (DSN with an
# embedded password, plaintext password / API key in Terraform). Known false positives:
# .gitleaks.toml allowlists (a class of values) or .gitleaksignore (one fingerprint).
#
# Values are always redacted in the log. Secrets already in git history are out of scope here
# (no history rewrite, see AA-841): a PR that only deletes a file never fails this check.
#
# workflow_dispatch: scan the whole working tree of the chosen ref instead.
# Run it locally: README.md, "Secret scan".
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest).
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          # Run as the runner user so git inside the container accepts the checkout's ownership.
          run_gitleaks() {
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
              "$@" --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
              --redact --verbose --no-banner --exit-code 1
          }
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning the commits of this PR: ${BASE_SHA}..${HEAD_SHA}"
            run_gitleaks git /repo --log-opts="${BASE_SHA}..${HEAD_SHA}" > scan.log 2>&1
          else
            echo "Scanning the working tree of ${GITHUB_REF}"
            run_gitleaks dir /repo > scan.log 2>&1
          fi
          status=$?
          cat scan.log
          {
            echo '### Secret scan (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No secrets found.'
            else
              echo 'gitleaks reported findings (values redacted). Remove the secret from the PR'
              echo 'commits and rotate it; for a false positive, add a narrow allowlist entry to'
              echo '`.gitleaks.toml` or its fingerprint to `.gitleaksignore`.'
              echo '```'
              grep -E '^(Finding|RuleID|File|Line|Commit|Fingerprint):' scan.log | grep -v '^Finding:' || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
