name: Secret Scan
# AA-841: fail a PR that adds a secret. gitleaks scans the lines the PR's commits add
# (base..head), with the default rules plus this repo's rules in .gitleaks.toml (DSN with an
# embedded password, plaintext password / API key in Terraform, credential-named key with a
# literal value in tfvars / .env / JSON / YAML). Known false positives: prefer a .gitleaks.toml
# allowlist (a class of values; it matches every commit, so it survives the squash merge). A commit
# fingerprint in .gitleaksignore does not survive the squash merge (see the header of that file).
#
# The PR scan reads .gitleaks.toml and .gitleaksignore from the PR's BASE commit, so a PR cannot
# add a secret together with an ignore line or an allowlist entry and pass. A PR that changes either
# file or this workflow, or adds a line with an inline `gitleaks:allow` comment (that hides the line
# from both jobs), fails until a reviewer adds the label `secret-scan-baseline-reviewed`; the scan
# then uses the PR's own copies. The label counts only on the run that adding it starts: any later
# event of the PR with the label on (a push, a (re)open, another label) removes it and fails, so the
# reviewer adds it again after the last push (the gitleaks job has `pull-requests: write` for that
# only). The three files are in CODEOWNERS.
#
# AA-981: the PR scan never sees what is already in history, and this repo is public (22/10/2026),
# so every old commit is readable. The "history" job scans every commit of every branch and tag,
# plus the head of every pull request (`refs/pull/*/head`: GitHub keeps them, closed PRs included,
# after the branch is deleted, and anyone can fetch them), nightly, on each push to main and on
# demand. Findings that were already there are pinned by commit fingerprint in .gitleaksignore,
# so the job is green today and red on anything new.
#
# Merge commits are read as their remerge diff (`--diff-merges=remerge`, git >= 2.36; the image ships 2.43): what the
# merge adds beyond git's own automatic merge of its parents. gitleaks alone skips merge commits, so a secret added
# in a merge was not seen; an update-branch merge adds nothing of its own, so the base-branch lines it brings in are
# not scanned again. A conflicted merge shows its resolution as added lines.
# The guard is advisory while the default branch does not require code-owner review: a pull_request run uses the PR's
# own copy of this file, so a PR can change the check itself. A PR that edits this file needs the label too, which
# catches a careless edit, not a hostile one. Require code-owner review for /.github/ and the two files when the merge
# rule tightens (first prod or first paying tenant).
#
# Values are always redacted in the log.
#
# workflow_dispatch: the "gitleaks" job scans the whole working tree of the chosen ref and the
# "history" job scans the full history (run it on a branch to test a new finding).
# Run it locally: README.md, "Secret scan".
on:
  pull_request:
    branches: [main]
    # labeled / unlabeled: rerun when `secret-scan-baseline-reviewed` is added or removed
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  schedule:
    - cron: "23 19 * * *" # 02:23 in Vietnam
  workflow_dispatch:

# Runs of one PR cancel each other. The label guard below does not depend on an earlier run having finished.
concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets, no third-party action: a pinned gitleaks image (version + digest).
permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854

jobs:
  gitleaks:
    name: gitleaks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # only to remove a stale `secret-scan-baseline-reviewed` label (see the step below)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }} # the label added or removed, on labeled / unlabeled
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }} # not passed to the gitleaks container
          BASELINE_REVIEWED: ${{ contains(github.event.pull_request.labels.*.name, 'secret-scan-baseline-reviewed') }}
        run: |
          set +e
          cfg="$RUNNER_TEMP/gitleaks-cfg"
          mkdir -p "$cfg"
          label=secret-scan-baseline-reviewed
          guard=0
          # Files where the given commits add a line with an inline allow comment, which hides that line from both
          # jobs. Same patches as the scan below: each commit's diff, a merge commit as its remerge diff (what the
          # merge adds beyond git's automatic merge of its parents). Prints file names only, never the lines.
          allow_files() {
            git log -p -U0 --diff-merges=remerge --no-color --no-ext-diff --format= "$@" | awk '
              /^diff --/ { hdr = 1; next }
              /^@@/ { hdr = 0; next }
              hdr && /^\+\+\+ / { f = substr($0, 7); next }
              !hdr && /^\+/ && index($0, "gitleaks:allow") { print f }' | sort -u | tr '\n' ' '
          }
          if [ "$EVENT" = "pull_request" ]; then
            # Rules and baseline come from the base branch: a PR cannot loosen the scan that judges it.
            touched=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- .gitleaks.toml .gitleaksignore .github/workflows/secret-scan.yml | tr '\n' ' ')
            allowed=$(allow_files "${BASE_SHA}..${HEAD_SHA}")
            what=""
            [ -n "$touched" ] && what="changes ${touched}"
            [ -n "$allowed" ] && what="${what:+${what}and }adds an inline gitleaks:allow in ${allowed}"
            # The label counts only on the run that adding it starts (event `labeled` for this label): the reviewer
            # adds it after reading the PR at its current head. Any other event with the label already on (a push, an
            # open or reopen, another label added or removed) removes it and fails, so it never carries over to
            # commits the reviewer has not seen. This holds whatever happened to earlier runs: runs of one PR cancel
            # each other, and an event payload can still list a label that an earlier run was about to remove.
            if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ] && { [ "$ACTION" != labeled ] || [ "$EVENT_LABEL" != "$label" ]; }; then
              BASELINE_REVIEWED=false
              why="this run was started by '${ACTION}${EVENT_LABEL:+ ${EVENT_LABEL}}', not by adding the label"
              if gh api --method DELETE "repos/${GH_REPO}/issues/${PR_NUMBER}/labels/${label}" --silent; then
                echo "::warning title=gitleaks baseline::Removed the label ${label}: ${why}. A reviewer reads the PR at its current head and adds it again."
              else
                echo "::error title=gitleaks baseline::${why}, and the label ${label} could not be removed (already removed, or a fork PR with a read-only token). A maintainer removes it if it is still on, reviews the PR at its current head, then adds it again."
              fi
            fi
            src="$BASE_SHA"
            if [ -n "$what" ] && [ "$BASELINE_REVIEWED" = "true" ]; then
              echo "::notice title=gitleaks baseline::This PR ${what}and has the label ${label}: scanning with the PR's own copies."
              src="$HEAD_SHA"
            elif [ -n "$what" ]; then
              guard=1
              echo "::error title=gitleaks baseline::This PR ${what}(secret scan rules, baseline or workflow). The scan below uses the base branch copies. After review, add the label ${label} to rescan with the PR's copies."
            fi
            for f in .gitleaks.toml .gitleaksignore; do
              if ! git show "${src}:${f}" > "$cfg/$f" 2>/dev/null; then
                echo "::warning::${f} does not exist at ${src}; using the PR's copy (the PR that first adds it)."
                cp "$f" "$cfg/$f" 2>/dev/null || : > "$cfg/$f"
              fi
            done
            # gitleaks also loads <source>/.gitleaksignore on its own, on top of --gitleaks-ignore-path: put the
            # chosen copies in the checkout too (git mode reads commits, not these working-tree files).
            cp "$cfg/.gitleaks.toml" "$cfg/.gitleaksignore" .
          else
            cp .gitleaks.toml .gitleaksignore "$cfg/"
          fi
          # Run as the runner user so git inside the container accepts the checkout's ownership.
          run_gitleaks() {
            docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -v "$cfg:/cfg:ro" -w /repo "$GITLEAKS_IMAGE" \
              "$@" --config /cfg/.gitleaks.toml --gitleaks-ignore-path /cfg/.gitleaksignore \
              --redact --verbose --no-banner --exit-code 1
          }
          if [ "$EVENT" = "pull_request" ]; then
            echo "Scanning the commits of this PR: ${BASE_SHA}..${HEAD_SHA} (rules from ${src})"
            run_gitleaks git /repo --log-opts="--diff-merges=remerge ${BASE_SHA}..${HEAD_SHA}" > scan.log 2>&1
          else
            echo "Scanning the working tree of ${GITHUB_REF}"
            run_gitleaks dir . > scan.log 2>&1 # relative paths: path allowlists anchored at ^ match
          fi
          status=$?
          cat scan.log
          {
            echo '### Secret scan (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No secrets found.'
            else
              echo 'gitleaks reported findings (values redacted). Remove the secret from the PR'
              echo 'commits and rotate it. For a false positive, prefer a narrow allowlist entry in'
              echo '`.gitleaks.toml`: a commit fingerprint in `.gitleaksignore` does not survive the'
              echo 'squash merge (see that file). Either change needs the label'
              echo '`secret-scan-baseline-reviewed` after review.'
              echo '```'
              grep -E '^(Finding|RuleID|File|Line|Commit|Fingerprint):' scan.log | grep -v '^Finding:' || true
              echo '```'
            fi
            if [ "$guard" -ne 0 ]; then
              echo "This PR ${what}(secret scan rules, baseline or workflow). It needs the label"
              echo '`secret-scan-baseline-reviewed`, added by a reviewer who has read the PR at its current head,'
              echo 'after the last push (a later push, a (re)open or another label change removes it again).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$guard" -ne 0 ] && exit 1
          exit "$status"

  history:
    name: gitleaks full history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # every commit of every branch and tag

      - name: Fetch the head of every pull request
        # Closed PRs included: GitHub keeps refs/pull/N/head after the branch is deleted, and they are public.
        run: git fetch --quiet --no-tags origin '+refs/pull/*/head:refs/remotes/origin/pr/*'

      - name: Scan the full git history
        run: |
          set +e
          echo "Scanning $(git rev-list --all | wc -l) commits on $(git for-each-ref refs/remotes refs/tags | wc -l) refs (branches, tags, PR heads)"
          # gitleaks' own default log options are `--full-history --all --diff-filter=tuxdb`; remerge adds what merge
          # commits introduce (see the header).
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" \
            git /repo --log-opts="--all --full-history --diff-filter=tuxdb --diff-merges=remerge" \
            --config /repo/.gitleaks.toml --gitleaks-ignore-path /repo/.gitleaksignore \
            --redact --verbose --no-banner --exit-code 1 > scan.log 2>&1
          status=$?
          cat scan.log
          {
            echo '### Secret scan, full history (gitleaks)'
            if [ "$status" -eq 0 ]; then
              echo 'No new secrets in history (known findings are pinned in `.gitleaksignore`).'
            else
              echo 'gitleaks found a secret in history that is not in the baseline (values redacted).'
              echo 'A real secret: rotate it first (the repo is public, history is readable), then'
              echo 'add its commit fingerprint to `.gitleaksignore` with a comment. A false positive:'
              echo 'narrow allowlist entry in `.gitleaks.toml`, or its fingerprint in `.gitleaksignore`.'
              echo '```'
              grep -E '^(RuleID|File|Line|Commit|Date|Fingerprint):' scan.log || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error title=gitleaks full history::New secret-like finding in git history. See the job summary."
          fi
          exit "$status"
