name: ALB Rule Order

# AA-931 (CRM-03, v2.2 V3): the shared ALB's :80 listener is reached by API Gateway and by CloudFront
# (VPC origin). Rule order is the security control: CloudFront host rules, then "any X-AA-Origin -> 403",
# then the API Gateway path rules (accounts/aa365/alb_rules.tf). tools/terraform/alb_rule_order.py
# checks the Terraform source; its unit tests run here too.
# Offline, no AWS access.

on:
  pull_request:
    branches: [main]
    paths:
      - "accounts/aa365/**"
      - "modules/alb/**"
      - "modules/ecs/**"
      - "modules/elasticache/**"
      - "tools/terraform/**"
      - ".github/workflows/alb-rule-order.yml"
  push:
    branches: [main]
    paths:
      - "accounts/aa365/**"
      - "modules/alb/**"
      - "modules/ecs/**"
      - "modules/elasticache/**"
      - "tools/terraform/**"
      - ".github/workflows/alb-rule-order.yml"

permissions:
  contents: read

jobs:
  alb-rule-order:
    name: ALB rule order (V3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # AA-932: the CRM KMS alarm patterns (crm_data.tf) against the live-check events, offline.
      # AA-873 (S256): every GitHub OIDC role is triaged in the Access Analyzer archive rule with a pinned subject, and
      # the iam-change alert covers every IAM write verb of tools/terraform/sec_alert_check.py.
      # AA-873 (S261): who may read secret values (CIS task role Deny, apply boundary Deny, ops key resource policies);
      # it reads modules/ecs and modules/elasticache too, hence those paths above.
      - name: Unit tests (rule-order checker + CRM edge live check + CRM KMS alarm patterns + security alerts + secret read guards)
        run: python -B -m pytest -p no:cacheprovider -q tools/terraform/tests/test_alb_rule_order.py tools/terraform/tests/test_crm_edge_live_check.py tools/terraform/tests/test_crm_kms_alarm_check.py tools/terraform/tests/test_sec_access_analyzer.py tools/terraform/tests/test_secret_read_guards.py

      - name: Check accounts/aa365 listener rules
        run: python3 -B tools/terraform/alb_rule_order.py --source accounts/aa365
