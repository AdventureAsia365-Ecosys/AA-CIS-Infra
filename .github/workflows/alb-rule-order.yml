name: ALB Rule Order

# AA-931 (CRM-03, v2.2 V3): the shared ALB's :80 listener is reached by API Gateway and by CloudFront
# (VPC origin). Rule order is the security control: CloudFront host rules, then "any X-AA-Origin -> 403",
# then the API Gateway path rules (accounts/aa365/alb_rules.tf). tools/terraform/alb_rule_order.py
# checks the Terraform source; its unit tests run here too.
# Offline, no AWS access.

on:
  pull_request:
    branches: [main]
    paths:
      - "accounts/aa365/**"
      - "accounts/management/variables.tf" # AA-873: digest regions follow the region SCP allow-list
      - "modules/alb/**"
      - "modules/ecs/**"
      - "modules/elasticache/**"
      - "modules/vpc/**"
      - "tools/terraform/**"
      - ".github/workflows/alb-rule-order.yml"
  push:
    branches: [main]
    paths:
      - "accounts/aa365/**"
      - "accounts/management/variables.tf" # AA-873: digest regions follow the region SCP allow-list
      - "modules/alb/**"
      - "modules/ecs/**"
      - "modules/elasticache/**"
      - "modules/vpc/**"
      - "tools/terraform/**"
      - ".github/workflows/alb-rule-order.yml"

permissions:
  contents: read

jobs:
  alb-rule-order:
    name: ALB rule order (V3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install "pytest>=8,<10"

      # AA-932: the CRM KMS alarm patterns (crm_data.tf) against the live-check events, offline.
      # AA-873 (S256): every GitHub OIDC role is triaged in the Access Analyzer archive rule with a pinned subject, and
      # the iam-change alert covers every IAM write verb of tools/terraform/sec_alert_check.py.
      # AA-873 (S261): who may read secret values (CIS task role Deny, apply boundary Deny, ops key resource policies);
      # it reads modules/ecs and modules/elasticache too, hence those paths above.
      # AA-1022: S3 gateway endpoint (modules/vpc, hence that path), NAT recover alarm, OIDC ref pins, Identity Center
      # administrator session alert.
      # AA-1025 (S263 alert diet): the alarms the diet must keep (NAT instance check, identity unexpected-error alarm).
      # AA-1027 F4: the CRM model grant stays least privilege (crm_llm.tf: InvokeModel on Nova Lite only).
      - name: Unit tests (rule-order checker + CRM edge live check + CRM KMS alarm patterns + security alerts + secret read guards + AA-1022 hardening + AA-1025 alert diet + AA-1027 CRM model grant)
        run: python -B -m pytest -p no:cacheprovider -q tools/terraform/tests/test_alb_rule_order.py tools/terraform/tests/test_crm_edge_live_check.py tools/terraform/tests/test_crm_kms_alarm_check.py tools/terraform/tests/test_sec_access_analyzer.py tools/terraform/tests/test_secret_read_guards.py tools/terraform/tests/test_aa1022_hardening.py tools/terraform/tests/test_sec_admin_digest.py tools/terraform/tests/test_aa1025_alert_diet.py tools/terraform/tests/test_aa1027_crm_llm.py

      - name: Check accounts/aa365 listener rules
        run: python3 -B tools/terraform/alb_rule_order.py --source accounts/aa365
