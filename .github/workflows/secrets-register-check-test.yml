name: Secrets Register Check Tests

# AA-878: unit tests of tools/secrets/register_check.py, the metadata-only drift check between the
# root repo's docs/security/secrets-register.yaml and the live inventories. Offline (synthetic
# register + inventories), no AWS access, no secret read.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/secrets/**"
      - ".github/workflows/secrets-register-check-test.yml"
  push:
    branches: [main]
    paths:
      - "tools/secrets/**"
      - ".github/workflows/secrets-register-check-test.yml"

permissions:
  contents: read

jobs:
  register-check-tests:
    name: Secrets register check tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest and PyYAML
        run: python -m pip install "pytest>=8,<10" pyyaml==6.0.2

      - name: Run tool tests
        run: python -m pytest -p no:cacheprovider -q tools/secrets/tests
