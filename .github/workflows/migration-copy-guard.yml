name: Migration Copy Guard
# AA-807: every DB Migrate copy in db/migrations/<owner>/ must be byte-identical to the same file on
# the owner repo's main (AA-CIS-App api/migrations, AA-TripPlanner-Web migrations, AA-Booking
# migrations) and register its own version key (NNN / tp-NNN / bk-NNN) in shared.schema_versions.
#
# Migration flow (S237 D8): migration-file-only PR merged to the owner's main FIRST → Infra copy PR
# (this check) → DB Migrate check → apply → the app PR that uses the new objects. A copy PR opened
# before the owner PR merges fails here with "merge the migration-only PR in the owner repo first".
#
# pull_request: only the files the PR adds or changes. schedule / manual: every copy, so a later
# edit of an already-copied file on an owner's main also shows up.
#
# Second job (AA-807 N5, no network): unique migration number per owner (MIG-3) and the
# run_migration.py lint on every copy — `-- migrate:` directives parse, CONCURRENTLY only in a
# `-- migrate: no-transaction` file, DROP TABLE/SCHEMA/COLUMN and TRUNCATE only with
# `-- migrate: destructive` (MIG-9, MIG-10, MIG-12), plus the X1 role lint for owner files above
# today's heads (db/owners.yaml role_lint_from). DB Migrate runs the same lint before apply.
# db/migrations/roles/ (key rl-NNN) is Infra-native: path, registration and lint only, no owner compare.
on:
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/check_migration_copies.py"
      - "db/check_migration_files.py"
      - "db/run_migration.py"
      - "db/tests/**"
      - "db/owners.yaml"
      - ".github/workflows/db-migrate.yml"
      - ".github/workflows/migration-copy-guard.yml"
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: migration-copy-guard-${{ github.ref }}
  cancel-in-progress: true

# No AWS, no secrets: the owner repos are public, GITHUB_TOKEN only lifts the API rate limit.
permissions:
  contents: read

jobs:
  guard:
    name: Copies match owner main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # PyYAML only for the registry test (db/tests/test_owners_registry.py reads db/owners.yaml and
      # the workflow); the guards and the runner stay standard-library only.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Guard unit tests
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python -m unittest discover -s db/tests -v

      - name: Compare copies with owner main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          if [ "$EVENT" = "pull_request" ]; then
            # Added, copied, modified, renamed files only; a deleted copy has nothing to compare.
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- db/migrations/ > changed.txt
            # Editing a copy that is already on main is legal only before it is applied: DB Migrate
            # never re-runs a registered version, so an edit to an applied file is a silent no-op.
            git diff --name-only --diff-filter=M "$BASE_SHA"...HEAD -- db/migrations/ | while read -r f; do
              echo "::warning file=$f::edits a copy already on main. If this version is applied, DB Migrate will not re-run it: ship the change as a new migration instead."
            done
          else
            : > changed.txt
          fi
          if [ -s changed.txt ]; then
            echo "changed migration copies:"; cat changed.txt
            xargs -a changed.txt python3 db/check_migration_copies.py > guard.log 2>&1
          else
            # Nightly / manual, or a PR that only changes the guard itself: check every copy.
            python3 db/check_migration_copies.py --all > guard.log 2>&1
          fi
          status=$?
          cat guard.log
          { echo '### Migration copy guard'; echo '```'; grep -v '^::' guard.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    name: Migration lint and unique numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint every copy, check numbers are unique per owner
        run: |
          set +e
          python3 db/check_migration_files.py > lint.log 2>&1
          status=$?
          cat lint.log
          { echo '### Migration lint and unique numbers'; echo '```'; grep -v '^::' lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
