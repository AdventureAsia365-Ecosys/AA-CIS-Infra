name: Migration Copy Guard
# AA-807: every DB Migrate copy in db/migrations/<owner>/ must be byte-identical to the same file on
# the owner repo's main (AA-CIS-App api/migrations, AA-TripPlanner-Web migrations, AA-Booking
# migrations) and register its own version key (NNN / tp-NNN / bk-NNN) in shared.schema_versions.
# The code copies in check_migration_copies.CODE_COPIES (db/rls_catalogue_rules.py, the X2 RLS catalogue
# rules from AA-CIS-App) get the same byte compare.
#
# Migration flow (S237 D8): migration-file-only PR merged to the owner's main FIRST → Infra copy PR
# (this check) → DB Migrate check → apply → the app PR that uses the new objects. A copy PR opened
# before the owner PR merges fails here with "merge the migration-only PR in the owner repo first".
#
# pull_request: only the files the PR adds or changes. schedule / manual: every copy, so a later
# edit of an already-copied file on an owner's main also shows up.
#
# Second job (AA-807 N5, no network): unique migration number per owner (MIG-3) and the
# run_migration.py lint on every copy — `-- migrate:` directives parse, CONCURRENTLY only in a
# `-- migrate: no-transaction` file, DROP TABLE/SCHEMA/COLUMN and TRUNCATE only with
# `-- migrate: destructive` (MIG-9, MIG-10, MIG-12), plus the X1 role lint for owner files above
# today's heads (db/owners.yaml role_lint_from) and the role switch's shape rule for them (one
# BEGIN … COMMIT block, or no-transaction). DB Migrate runs the same lint before apply.
# db/migrations/roles/ (key rl-NNN) is Infra-native: path, registration and lint only, no owner compare.
# The lint also fails a `COMMENT ON COLUMN … IS 'pii:<class>…'` whose class is not a data standards DM-6.1 class
# (gen_schema_reference.TAG_CLASSES, standards v1.3, AA-929).
#
# Third job (AA-929, data standards DM-7.1): every table a copy of a new-app dir (check_retention_rows.RETENTION_OWNERS,
# today crm) creates must have a row in the retention table of Part B section 7 on the root repo's master. The job
# reads that one file with a READ-ONLY installation token of the GitHub App aa-ecosys-ci-bot (AA-901, root ADR 0011:
# Contents read on AdventureAsia365-Ecosys/AA-Ecosys only, minted in the job, revoked when it ends) and only when a
# scoped dir has a copy; with no such copy it passes without minting a token. The job also runs on pull_request, so
# it never asks for a write permission. The existing owners' tables are grandfathered (DM-7.1).
on:
  pull_request:
    branches: [main]
    paths:
      - "db/migrations/**"
      - "db/check_migration_copies.py"
      - "db/rls_catalogue_rules.py"
      - "db/replay_migrations.py"        # AA-853 drift report (DB Schema Dump); unit tests in db/tests
      - "db/schema_drift.py"
      - "db/schema_drift_decisions.json"
      - "db/replay_baseline/**"
      - "db/gen_schema_reference.py"
      - "db/gen_erd.py"
      - "tools/docs/aws_mask.py"   # imported by db/gen_schema_reference.py (AA-981)
      - "db/check_erd_drift.py"
      - "db/schema_dump.py"
      - "db/check_migration_files.py"
      - "db/check_retention_rows.py"
      - "db/run_migration.py"
      - "db/tests/**"
      - "db/owners.yaml"
      - "db/isolation_probe.py"
      - "db/tour_liveness_gate.py"
      - "db/scripts/**"
      - "db/templates/**"
      - ".github/scripts/**"
      - ".github/workflows/db-isolation-probe.yml"
      - ".github/workflows/db-tour-liveness-gate.yml"
      - ".github/workflows/db-migrate.yml"
      - ".github/workflows/db-schema-dump.yml"
      - ".github/workflows/migration-copy-guard.yml"
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: migration-copy-guard-${{ github.ref }}
  cancel-in-progress: true

# No AWS: the owner repos are public, GITHUB_TOKEN only lifts the API rate limit. The one secret is the App key
# AA_CI_BOT_PRIVATE_KEY (with the variable AA_CI_BOT_APP_ID) in the retention-rows job: it mints a Contents-read
# token for the root repo (reads one root file; only when a crm copy exists).
permissions:
  contents: read

jobs:
  guard:
    name: Copies match owner main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PyYAML only for the registry test (db/tests/test_owners_registry.py reads db/owners.yaml and
      # the workflow); the guards and the runner stay standard-library only.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard unit tests
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python -m unittest discover -s db/tests -v

      - name: Compare copies with owner main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          if [ "$EVENT" = "pull_request" ]; then
            # Added, copied, modified, renamed files only; a deleted copy has nothing to compare.
            # Plus the code copies of check_migration_copies.CODE_COPIES (X2 RLS catalogue rules).
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- db/migrations/ db/rls_catalogue_rules.py > changed.txt
            # Editing a copy that is already on main is legal only before it is applied: DB Migrate
            # never re-runs a registered version, so an edit to an applied file is a silent no-op.
            git diff --name-only --diff-filter=M "$BASE_SHA"...HEAD -- db/migrations/ | while read -r f; do
              echo "::warning file=$f::edits a copy already on main. If this version is applied, DB Migrate will not re-run it: ship the change as a new migration instead."
            done
          else
            : > changed.txt
          fi
          if [ -s changed.txt ]; then
            echo "changed migration copies:"; cat changed.txt
            xargs -a changed.txt python3 db/check_migration_copies.py > guard.log 2>&1
          else
            # Nightly / manual, or a PR that only changes the guard itself: check every copy.
            python3 db/check_migration_copies.py --all > guard.log 2>&1
          fi
          status=$?
          cat guard.log
          { echo '### Migration copy guard'; echo '```'; grep -v '^::' guard.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    name: Migration lint and unique numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint every copy, check numbers are unique per owner
        run: |
          set +e
          python3 db/check_migration_files.py > lint.log 2>&1
          status=$?
          cat lint.log
          { echo '### Migration lint and unique numbers'; echo '```'; grep -v '^::' lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # X1 S12: every db/scripts/ file DB Migrate mode=run-script could run has the shape the runner
      # needs (top-level async def main(conn)); the same check runs again at dispatch and in the task.
      - name: Shape of db/scripts files (run-script)
        run: |
          status=0
          for f in db/scripts/*.py; do
            [ -e "$f" ] || continue
            if ! [[ "$f" =~ ^db/scripts/[a-z0-9_]+\.py$ ]]; then
              echo "::error file=$f::name must be db/scripts/<lower case, digits, underscores>.py"; status=1; continue
            fi
            out=$(python3 db/run_migration.py --inspect-script "$f") || status=1
            jq -r --arg f "$f" '.errors[] | "::error file=" + $f + "::" + .' <<<"$out"
          done
          exit "$status"

  retention-rows:
    name: Retention rows for new-app tables
    runs-on: ubuntu-latest
    env:
      ROOT_REPO: AdventureAsia365-Ecosys/AA-Ecosys
      ROOT_BRANCH: master
      REGISTRY_PATH: docs/architecture/data-standards/02-data-management.md
      HAS_CI_BOT_APP: ${{ vars.AA_CI_BOT_APP_ID != '' && secrets.AA_CI_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Is any new-app dir in scope?
        id: scope
        run: echo "scoped=$(python3 db/check_retention_rows.py --scoped)" >> "$GITHUB_OUTPUT"

      # AA-901: Contents READ only (this job runs on pull_request too: it must never mint a write token).
      - name: Mint the aa-ecosys-ci-bot token (root repo, contents read)
        id: app-token
        if: steps.scope.outputs.scoped == 'yes' && env.HAS_CI_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: AA-Ecosys
          permission-contents: read

      - name: Fetch the retention registry from the root repo's master
        if: steps.scope.outputs.scoped == 'yes'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$HAS_CI_BOT_APP" != "true" ]; then
            echo "::error::the aa-ecosys-ci-bot App is not configured (repo variable AA_CI_BOT_APP_ID and/or secret AA_CI_BOT_PRIVATE_KEY missing): the retention registry on the root repo cannot be read (see the header of this workflow)"
            exit 1
          fi
          gh api -H "Accept: application/vnd.github.raw" "repos/$ROOT_REPO/contents/$REGISTRY_PATH?ref=$ROOT_BRANCH" > registry.md
          test -s registry.md

      - name: Every scoped table has a DM-7 row
        run: |
          set +e
          if [ "${{ steps.scope.outputs.scoped }}" = "yes" ]; then
            python3 db/check_retention_rows.py --registry registry.md > retention.log 2>&1
          else
            python3 db/check_retention_rows.py > retention.log 2>&1
          fi
          status=$?
          cat retention.log
          { echo '### Retention rows (DM-7.1)'; echo '```'; grep -v '^::' retention.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
