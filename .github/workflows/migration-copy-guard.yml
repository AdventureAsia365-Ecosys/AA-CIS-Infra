name: Migration Copy Guard
# AA-807: every DB Migrate copy in db/migrations/<owner>/ must be byte-identical to the same file on
# the owner repo's main (AA-CIS-App api/migrations, AA-TripPlanner-Web migrations, AA-Booking
# migrations) and register its own version key (NNN / tp-NNN / bk-NNN) in shared.schema_versions.
# The code copies in check_migration_copies.CODE_COPIES (db/rls_catalogue_rules.py, the X2 RLS catalogue
# rules from AA-CIS-App) get the same byte compare.
#
# Migration flow (S237 D8): migration-file-only PR merged to the owner's main FIRST → Infra copy PR
# (this check) → DB Migrate check → apply → the app PR that uses the new objects. A copy PR opened
# before the owner PR merges fails here with "merge the migration-only PR in the owner repo first".
#
# pull_request: only the files the PR adds or changes. schedule / manual: every copy, so a later
# edit of an already-copied file on an owner's main also shows up.
#
# Second job (AA-807 N5, no network): unique migration number per owner (MIG-3) and the
# run_migration.py lint on every copy — `-- migrate:` directives parse, CONCURRENTLY only in a
# `-- migrate: no-transaction` file, DROP TABLE/SCHEMA/COLUMN and TRUNCATE only with
# `-- migrate: destructive` (MIG-9, MIG-10, MIG-12), plus the X1 role lint for owner files above
# today's heads (db/owners.yaml role_lint_from) and the role switch's shape rule for them (one
# BEGIN … COMMIT block, or no-transaction). DB Migrate runs the same lint before apply.
# db/migrations/roles/ (key rl-NNN) is Infra-native: path, registration and lint only, no owner compare.
# The lint also fails a `COMMENT ON COLUMN … IS 'pii:<class>…'` whose class is not a data standards DM-6.1 class
# (gen_schema_reference.TAG_CLASSES, standards v1.3, AA-929), and (AA-853, db/check_migration_ownership.py) an owner-dir
# file that creates, alters, drops, comments on, grants on or writes to an object outside its owner's schemas
# (db/owners.yaml `schemas`; its own shared.schema_versions registration excepted).
#
# Third job (AA-929, data standards DM-7.1): every table a copy of a new-app dir (check_retention_rows.RETENTION_OWNERS,
# today crm) creates must have a row in the retention table of Part B section 7 on the root repo's master. The job
# reads that one file with a READ-ONLY installation token of the GitHub App aa-ecosys-ci-bot (AA-901, root ADR 0011:
# Contents read on AdventureAsia365-Ecosys/AA-Ecosys only, minted in the job, revoked when it ends) and only when a
# scoped dir has a copy; with no such copy it passes without minting a token. The job also runs on pull_request, so
# it never asks for a write permission. The existing owners' tables are grandfathered (DM-7.1).
# AA-993 I1 (S255): no `paths` filter on pull_request any more. The jobs below are required checks of the ruleset on
# main (tools/github/infra-main-ruleset.json), and a required check whose workflow never starts blocks the PR. The job
# `scope` decides instead (tools/github/pr_paths.py, the path list that used to be the filter): when the PR touches
# none of those paths, guard, lint and retention-rows are skipped, and a skipped job counts as passed.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"   # nightly, 02:17 UTC
  workflow_dispatch:

concurrency:
  group: migration-copy-guard-${{ github.ref }}
  cancel-in-progress: true

# No AWS: the owner repos are public, GITHUB_TOKEN only lifts the API rate limit. The one secret is the App key
# AA_CI_BOT_PRIVATE_KEY (with the variable AA_CI_BOT_APP_ID) in the retention-rows job: it mints a Contents-read
# token for the root repo (reads one root file; only when a crm copy exists).
permissions:
  contents: read

jobs:
  # AA-993 I1: replaces the old pull_request `paths` filter (see the comment above `on:`). Schedule and manual runs
  # always check everything.
  scope:
    name: Migration paths touched?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: db/migration_guard_scope.py
          sparse-checkout-cone-mode: false

      - name: Changed files vs the guard's path list
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "not a pull request: every job runs"; exit 0
          fi
          # Both names of a rename count (moving a file out of db/migrations/ is relevant too).
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > changed.txt
          # The files API lists at most 3000 files: a PR at that cap may hide a migration path, so it is relevant.
          N=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .changed_files)
          if [ "${N:-0}" -ge 3000 ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"; echo "$N changed files (>= 3000, the files API cap): every job runs"; exit 0
          fi
          python3 db/migration_guard_scope.py < changed.txt | tee -a "$GITHUB_OUTPUT"
          echo "$(wc -l < changed.txt) changed path(s)"

  guard:
    name: Copies match owner main
    needs: scope
    # Fail closed (review S255): skip only on an explicit relevant=false. A failed or cancelled `scope` (API error,
    # script error) leaves the output empty and this job runs the full check; a skipped job would count as passed.
    if: ${{ !cancelled() && needs.scope.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # PyYAML only for the registry test (db/tests/test_owners_registry.py reads db/owners.yaml and
      # the workflow); the guards and the runner stay standard-library only.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard unit tests
        run: |
          python -m pip install --quiet pyyaml==6.0.2
          python -m unittest discover -s db/tests -v

      - name: Compare copies with owner main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          if [ "$EVENT" = "pull_request" ]; then
            # Added, copied, modified, renamed files only; a deleted copy has nothing to compare.
            # Plus the code copies of check_migration_copies.CODE_COPIES (X2 RLS catalogue rules).
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- db/migrations/ db/rls_catalogue_rules.py > changed.txt
            # Editing a copy that is already on main is legal only before it is applied: DB Migrate
            # never re-runs a registered version, so an edit to an applied file is a silent no-op.
            git diff --name-only --diff-filter=M "$BASE_SHA"...HEAD -- db/migrations/ | while read -r f; do
              echo "::warning file=$f::edits a copy already on main. If this version is applied, DB Migrate will not re-run it: ship the change as a new migration instead."
            done
          else
            : > changed.txt
          fi
          if [ -s changed.txt ]; then
            echo "changed migration copies:"; cat changed.txt
            xargs -a changed.txt python3 db/check_migration_copies.py > guard.log 2>&1
          else
            # Nightly / manual, or a PR that only changes the guard itself: check every copy.
            python3 db/check_migration_copies.py --all > guard.log 2>&1
          fi
          status=$?
          cat guard.log
          { echo '### Migration copy guard'; echo '```'; grep -v '^::' guard.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  lint:
    name: Migration lint and unique numbers
    needs: scope
    # Fail closed (review S255): skip only on an explicit relevant=false. A failed or cancelled `scope` (API error,
    # script error) leaves the output empty and this job runs the full check; a skipped job would count as passed.
    if: ${{ !cancelled() && needs.scope.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint every copy, check numbers are unique per owner
        run: |
          set +e
          python3 db/check_migration_files.py > lint.log 2>&1
          status=$?
          cat lint.log
          { echo '### Migration lint and unique numbers'; echo '```'; grep -v '^::' lint.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # X1 S12: every db/scripts/ file DB Migrate mode=run-script could run has the shape the runner
      # needs (top-level async def main(conn)); the same check runs again at dispatch and in the task.
      - name: Shape of db/scripts files (run-script)
        run: |
          status=0
          for f in db/scripts/*.py; do
            [ -e "$f" ] || continue
            if ! [[ "$f" =~ ^db/scripts/[a-z0-9_]+\.py$ ]]; then
              echo "::error file=$f::name must be db/scripts/<lower case, digits, underscores>.py"; status=1; continue
            fi
            out=$(python3 db/run_migration.py --inspect-script "$f") || status=1
            jq -r --arg f "$f" '.errors[] | "::error file=" + $f + "::" + .' <<<"$out"
          done
          exit "$status"

  retention-rows:
    name: Retention rows for new-app tables
    needs: scope
    # Fail closed (review S255): skip only on an explicit relevant=false. A failed or cancelled `scope` (API error,
    # script error) leaves the output empty and this job runs the full check; a skipped job would count as passed.
    if: ${{ !cancelled() && needs.scope.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    env:
      ROOT_REPO: AdventureAsia365-Ecosys/AA-Ecosys
      ROOT_BRANCH: master
      REGISTRY_PATH: docs/architecture/data-standards/02-data-management.md
      HAS_CI_BOT_APP: ${{ vars.AA_CI_BOT_APP_ID != '' && secrets.AA_CI_BOT_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Is any new-app dir in scope?
        id: scope
        run: echo "scoped=$(python3 db/check_retention_rows.py --scoped)" >> "$GITHUB_OUTPUT"

      # AA-901: Contents READ only (this job runs on pull_request too: it must never mint a write token).
      - name: Mint the aa-ecosys-ci-bot token (root repo, contents read)
        id: app-token
        if: steps.scope.outputs.scoped == 'yes' && env.HAS_CI_BOT_APP == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: AA-Ecosys
          permission-contents: read

      - name: Fetch the retention registry from the root repo's master
        if: steps.scope.outputs.scoped == 'yes'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$HAS_CI_BOT_APP" != "true" ]; then
            echo "::error::the aa-ecosys-ci-bot App is not configured (repo variable AA_CI_BOT_APP_ID and/or secret AA_CI_BOT_PRIVATE_KEY missing): the retention registry on the root repo cannot be read (see the header of this workflow)"
            exit 1
          fi
          gh api -H "Accept: application/vnd.github.raw" "repos/$ROOT_REPO/contents/$REGISTRY_PATH?ref=$ROOT_BRANCH" > registry.md
          test -s registry.md

      - name: Every scoped table has a DM-7 row
        run: |
          set +e
          if [ "${{ steps.scope.outputs.scoped }}" = "yes" ]; then
            python3 db/check_retention_rows.py --registry registry.md > retention.log 2>&1
          else
            python3 db/check_retention_rows.py > retention.log 2>&1
          fi
          status=$?
          cat retention.log
          { echo '### Retention rows (DM-7.1)'; echo '```'; grep -v '^::' retention.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # AA-993 M2b (root ADR 0017 d3, design §2 M2b): the expand runtime post-check as evidence on the PR, on a throw-away
  # PostgreSQL 15 container on this runner (no AWS, no secret; the same pinned image as the DB Schema Dump replay).
  #   1. the M2b PostgreSQL tests (db/tests/test_aa993_expand_check_pg.py: the exit-14 and pass cases, the classify
  #      run, the RETURNING * proof of the hot-table rule);
  #   2. db/expand_check.py --classify on a fresh container: every applied migration replayed in the order of the live
  #      dump (schema.json of the latest successful DB Schema Dump run on main, retention 14 days; number order when
  #      there is none, critic 19), then every pending file rehearsed with the post-check and applied, in number order.
  #      On a pull request the exit is set by the owner-dir copies the PR adds or changes: 14 when one with the
  #      `-- migrate: expand` header changes an existing object. A file without the header is contract by definition;
  #      the summary only says whether the evidence would allow expand.
  # A required check of the ruleset on main (tools/github/infra-main-ruleset.json, context "Expand classify").
  classify:
    name: Expand classify
    needs: scope
    # Fail closed (review S255): skip only on an explicit relevant=false.
    if: ${{ !cancelled() && needs.scope.outputs.relevant != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read          # gh run download of the DB Schema Dump artifact (this repo only)
    env:
      # pgvector/pgvector:0.8.1-pg15 (PostgreSQL 15 + vector 0.8.1, as RDS), pinned to its image index digest.
      REPLAY_IMAGE: pgvector/pgvector@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
      OWNER_REPOS: AA-CIS-App AA-Booking AA-TripPlanner-Web AA-Partner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install asyncpg (post-check driver)
        run: python -m pip install --quiet asyncpg==0.30.0 pyyaml==6.0.2

      - name: Expand post-check tests on PostgreSQL 15
        run: |
          PW="$(openssl rand -hex 16)"
          docker run -d --name pg-tests -e POSTGRES_PASSWORD="$PW" -p 127.0.0.1:55433:5432 "$REPLAY_IMAGE" >/dev/null
          for i in $(seq 1 60); do docker exec pg-tests pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 2; done
          AA993_TEST_PG_DSN="postgresql://postgres:${PW}@127.0.0.1:55433/postgres" \
            python -m unittest db.tests.test_aa993_expand_check_pg -v
          docker rm -f pg-tests >/dev/null

      - name: Copies to classify
        id: files
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD -- \
              'db/migrations/cis/*.sql' 'db/migrations/booking/*.sql' 'db/migrations/tripplanner/*.sql' \
              'db/migrations/crm/*.sql' | sed 's#^db/migrations/##' > targets.txt
            echo "mode=$([ -s targets.txt ] && echo targets || echo none)" >> "$GITHUB_OUTPUT"
          else
            : > targets.txt
            echo "mode=all" >> "$GITHUB_OUTPUT"
          fi
          echo "copies to classify:"; cat targets.txt

      - name: Replay order (latest DB Schema Dump artifact)
        id: live
        if: steps.files.outputs.mode != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN=$(gh run list -R "$GITHUB_REPOSITORY" --workflow db-schema-dump.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN" ] && gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n "db-schema-dump-$RUN" -D dump \
              && [ -s dump/schema.json ]; then
            echo "path=dump/schema.json" >> "$GITHUB_OUTPUT"
            echo "replay order: the live dump of DB Schema Dump run $RUN"
          else
            echo "::warning::no DB Schema Dump artifact on main (expired or none): the replay falls back to number order"
          fi

      - name: Classify (expand post-check on a replay)
        if: steps.files.outputs.mode != 'none' && (steps.live.outputs.path != '' || steps.files.outputs.mode == 'targets')
        run: |
          PW="$(openssl rand -hex 16)"
          docker run -d --name classify-db -e POSTGRES_PASSWORD="$PW" -p 127.0.0.1:55432:5432 "$REPLAY_IMAGE" >/dev/null
          for r in $OWNER_REPOS; do
            git clone --quiet --depth 1 "https://github.com/AdventureAsia365-Ecosys/$r.git" "owners/$r"
            echo "$r main: $(git -C "owners/$r" rev-parse --short HEAD)"
          done
          # The copies here go over the owner folders: byte-identical once the Copy Guard is green, and a copy not on
          # the owner's main yet is still classified (the Copy Guard fails that PR on its own).
          cp db/migrations/cis/*.sql owners/AA-CIS-App/api/migrations/
          cp db/migrations/booking/*.sql owners/AA-Booking/migrations/
          cp db/migrations/tripplanner/*.sql owners/AA-TripPlanner-Web/migrations/
          cp db/migrations/crm/*.sql owners/AA-Partner/api/migrations/
          for i in $(seq 1 60); do docker exec classify-db pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 2; done
          ARGS=()
          [ -n "${{ steps.live.outputs.path }}" ] && ARGS+=(--live "${{ steps.live.outputs.path }}")
          if [ -s targets.txt ]; then ARGS+=(--files); while read -r f; do ARGS+=("$f"); done < targets.txt; fi
          set +e
          python3 db/expand_check.py --classify "${ARGS[@]}" \
            --admin-dsn "postgresql://postgres:${PW}@127.0.0.1:55432/postgres" \
            --source roles=db/migrations/roles --source cis=owners/AA-CIS-App/api/migrations \
            --source booking=owners/AA-Booking/migrations --source tripplanner=owners/AA-TripPlanner-Web/migrations \
            --source crm=owners/AA-Partner/api/migrations \
            --out classify.json --summary "$GITHUB_STEP_SUMMARY" > classify.log 2>&1
          status=$?
          grep -v '^REPLAY ok' classify.log
          if [ "$status" = "14" ]; then
            echo "::error::an expand file changes an existing object (CLASSIFY lines above): change it, or drop the \`-- migrate: expand\` header and ship it as a contract file (migration-only PR, manual DB Migrate apply)"
          fi
          exit "$status"

      - name: Keep the classify result as an artifact
        if: always() && steps.files.outputs.mode != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: expand-classify-${{ github.run_id }}
          path: |
            classify.json
            classify.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove the scratch containers
        if: always()
        run: docker rm -f pg-tests classify-db >/dev/null 2>&1 || true
