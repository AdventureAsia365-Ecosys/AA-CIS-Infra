name: Terraform Plan Guard Tests

# AA-846: unit tests of tools/terraform/plan_guard.py, the check that refuses a CI apply whose plan
# changes a guarded type (aws_secretsmanager_secret_version, random_password, aws_db_instance).
# AA-932: plus the Object Lock rule (COMPLIANCE create, any change to a lock configuration, deleting an Object
# Lock bucket) and the CRM key-policy diff tool (tools/terraform/crm_key_policy_diff.py), same test folder.
# Two tests read files outside tools/terraform (modules/environment/crm_storage.tf: Dev never COMPLIANCE; crm-key-policy-diff.yml:
# read-only, nightly, plan role), so those paths trigger this workflow too.
# AA-879: plus the scheduled drift report (tools/terraform/drift_report.py): its shape test reads terraform-drift.yml and
# terraform-plan.yml (same roots), and the report masks through tools/docs/aws_mask.py, so those paths trigger it too.
# AA-1004: plus the management account CI wiring (test_management_ci.py reads accounts/management/cicd.tf and the
# three Terraform workflows; the plan guard's destroy-guarded types are checked against that root's resource types).
# AA-1022: plus the action pin guard (test_workflow_action_pins.py: every `uses:` of .github/workflows on a full commit
# SHA with the tag in a comment), so any workflow change triggers this workflow (the named workflow paths below stay
# listed: other tests here check that the files they read are named).
# S263 (AA-939 follow-up): plus the partner-pool AdminDeleteUser guards (test_partner_pool_delete_user.py reads
# identity_partner.tf and identity_iam.tf), so those paths trigger it too.
# AA-1004 S273: plus the organization admin role of the nonprod account and the Transitional OU
# (test_aa1004_org_access.py reads accounts/aa365/org_access.tf, its terraform.tfvars and accounts/management/**).
# S271 lessons guards: G9 test_workflow_tf_locking.py (every Terraform run waits for the state lock; PR plans have no group),
# G13 test_iam_trust_inventory.py (tools/terraform/iam_trust_inventory.py; a .tf change does not need to trigger this
# workflow: the required Terraform Plan (dev) check runs the same static scan on every PR), G15 test_workflow_lint.py
# (.github/scripts/workflow_lint.py).
# S271: plus the tag guard (tools/terraform/tag_guard.py; test_tag_guard.py reads every root's versions.tf, so those
# files trigger it too, accounts/management/** already does) and the monthly untagged report
# (tools/finops/untagged_report.py, tools/finops/tests).
# The guarded fixture must exit non-zero, the clean and no-op fixtures must exit 0, and the guard
# must stay wired in front of the apply step in terraform-apply.yml. Offline, no AWS access.

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/terraform/**"
      - "tools/finops/**" # S271: untagged_report.py (tagging standard FIN-03)
      - ".github/workflows/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/tf-plan-guard-test.yml"
      - "modules/environment/crm_storage.tf" # AA-1004 slice 2 (was accounts/aa365); also under modules/environment/** below
      - "accounts/aa365/identity_partner.tf"
      - "accounts/aa365/identity_iam.tf"
      - "accounts/aa365/identity_partner_read.tf" # AA-1039 R6: the CIS read of partner member addresses
      - "accounts/aa365/cicd_split.tf" # AA-1023: the apply role trust vs the workflow environments
      - "accounts/aa365/environment.tf" # AA-1004 P0: the moved blocks into modules/environment
      - "accounts/aa365/org_access.tf" # AA-1004 S273: test_aa1004_org_access.py (organization admin role)
      - "accounts/aa365/terraform.tfvars" # AA-1004 S273: test_aa1004_org_access.py (no management ID committed)
      - "modules/environment/**"
      - ".github/scripts/prod-guard.sh" # AA-1004 P0: Deploy Prod / DB Migrate prod guard
      - ".github/workflows/crm-key-policy-diff.yml"
      - ".github/workflows/terraform-drift.yml"
      - ".github/workflows/terraform-plan.yml"
      - "tools/docs/aws_mask.py"
      - "accounts/management/**"
      - "accounts/aa365/versions.tf" # S271: provider default_tags (test_tag_guard.py)
      - "accounts/acc3-bedrock/versions.tf"
      - "accounts/acc1-bedrock/versions.tf" # AA-1095: test_tag_guard.py ROOT_DEFAULTS
      - ".github/scripts/workflow_lint.py" # S271 G15: test_workflow_lint.py
  push:
    branches: [main]
    paths:
      - "tools/terraform/**"
      - "tools/finops/**" # S271: untagged_report.py (tagging standard FIN-03)
      - ".github/workflows/**"
      - ".github/workflows/terraform-apply.yml"
      - ".github/workflows/tf-plan-guard-test.yml"
      - "modules/environment/crm_storage.tf" # AA-1004 slice 2 (was accounts/aa365); also under modules/environment/** below
      - "accounts/aa365/identity_partner.tf"
      - "accounts/aa365/identity_iam.tf"
      - "accounts/aa365/identity_partner_read.tf" # AA-1039 R6: the CIS read of partner member addresses
      - "accounts/aa365/cicd_split.tf" # AA-1023: the apply role trust vs the workflow environments
      - "accounts/aa365/environment.tf" # AA-1004 P0: the moved blocks into modules/environment
      - "accounts/aa365/org_access.tf" # AA-1004 S273: test_aa1004_org_access.py (organization admin role)
      - "accounts/aa365/terraform.tfvars" # AA-1004 S273: test_aa1004_org_access.py (no management ID committed)
      - "modules/environment/**"
      - ".github/scripts/prod-guard.sh" # AA-1004 P0: Deploy Prod / DB Migrate prod guard
      - ".github/workflows/crm-key-policy-diff.yml"
      - ".github/workflows/terraform-drift.yml"
      - ".github/workflows/terraform-plan.yml"
      - "tools/docs/aws_mask.py"
      - "accounts/management/**"
      - "accounts/aa365/versions.tf" # S271: provider default_tags (test_tag_guard.py)
      - "accounts/acc3-bedrock/versions.tf"
      - "accounts/acc1-bedrock/versions.tf" # AA-1095: test_tag_guard.py ROOT_DEFAULTS
      - ".github/scripts/workflow_lint.py" # S271 G15: test_workflow_lint.py

permissions:
  contents: read

jobs:
  plan-guard-tests:
    name: Terraform plan guard tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pytest and PyYAML
        run: python -m pip install "pytest>=8,<10" pyyaml==6.0.2

      - name: Run guard tests
        run: python -m pytest -p no:cacheprovider -q tools/terraform/tests tools/finops/tests

      # The same command the apply workflow's self-test runs; it must refuse.
      - name: Guarded fixture is refused
        run: |
          set +e
          python3 -B tools/terraform/plan_guard.py tools/terraform/tests/fixtures/plan_guarded.json
          RC=$?
          set -e
          if [ "$RC" -ne 1 ]; then
            echo "expected exit 1 (refused), got $RC" >&2
            exit 1
          fi
